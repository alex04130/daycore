# AI model catalog — the set of models the app can use is fully data-driven.
# Add/remove entries here (no code changes) to support more models. Each entry
# binds a model id to a registered wire format (openai | anthropic | ollama | …).
#
# caps: vision/tools are declared, not auto-detected. The vision model is
# whichever entry has `vision: true` (or DEFAULT_VISION_MODEL). The default chat
# model is DEFAULT_CHAT_MODEL (env), which must match an id below.
#
# `id` is OUR stable name; `model` is the vendor's, and the vendor's is the half
# that rots — they retire and rename on their own schedule. Rotating to a newer
# upstream model is a one-line edit to `model:` and touches nothing else, which
# only works if ids say what an entry is FOR rather than what is behind it today.
# See internal/ai/seed/models.yaml — the copy `daycore install` writes.
models:
  # ── Default chat (DeepSeek, OpenAI-compatible) ─────────────────────────────
  - id: chat
    format: openai
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    vision: false
    tools: true
    context_window: 65536
    max_tokens: 4096

  # ── Same model over Anthropic format — meant for native web_search ─────────
  # ⚠️ ToolDef.ServerSide has no implementation in any format (see docs/AI.md),
  # so this entry currently behaves as plain Anthropic-format DeepSeek.
  - id: chat-search
    format: anthropic
    base_url: https://api.deepseek.com/anthropic
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    vision: false
    tools: true
    context_window: 65536
    max_tokens: 4096

  # ── Thinking model for auto-plan (set DEFAULT_PLANNER_MODEL=planner) ───────
  - id: planner
    format: openai
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    vision: false
    tools: true
    context_window: 65536
    max_tokens: 8192
    extra_body:
      thinking:
        enabled: true

  # ── Vision (Anthropic Messages API) — image→plan, material screenshots ─────
  - id: vision
    format: anthropic
    base_url: https://api.anthropic.com
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    vision: true
    tools: true
    context_window: 200000

  # ── Alternative vision / chat (OpenAI) ─────────────────────────────────────
  - id: openai
    format: openai
    base_url: https://api.openai.com/v1
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    vision: true
    tools: true
    context_window: 128000

  # ── Local Ollama — offline vision, no API key ──────────────────────────────
  - id: local
    format: ollama
    base_url: http://localhost:11434
    model: llava
    vision: true
    tools: false
    context_window: 8192
