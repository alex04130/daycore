<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      max-width: 560px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1f2430;
    }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #c6cbd9;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      margin-top: 16px;
      padding: 9px 20px;
      border: none;
      border-radius: 10px;
      background: #4a6cf7;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #saved { margin-left: 12px; color: #256029; }
    #saved.error { color: #b3261e; }
  </style>
</head>
<body>
  <h1 data-i18n="optTitle"></h1>
  <label for="daycore-url" data-i18n="optDaycoreURL"></label>
  <input id="daycore-url" type="url" placeholder="http://localhost:8080" />
  <label for="import-token" data-i18n="optToken"></label>
  <input id="import-token" type="text" placeholder="dcimp_…" />
  <label for="domains" data-i18n="optDomains"></label>
  <textarea id="domains" placeholder="canvas.umn.edu"></textarea>
  <button id="save" data-i18n="optSave"></button><span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
