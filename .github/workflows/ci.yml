name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # Real MongoDB, PostgreSQL and MySQL, because the storage conformance suite
    # (internal/storage/storagetest) is the only thing asserting that the four
    # backends BEHAVE the same, and for a long time only SQLite ever ran here.
    #
    # Mongo: an adversarial review found ~15 divergences between the two shipped
    # stores precisely because mongostore had no integration coverage at all.
    #
    # Postgres and MySQL: their DDL was written from documentation and checked
    # only by dialect_parity_test.go, which compares the three DDL strings to
    # each other — a static check that cannot know whether any of them is legal.
    # Three real incidents got through that gap, and every one was a
    # first-statement failure that executing the DDL once would have caught:
    # MySQL refusing a literal DEFAULT on TEXT (the server would not boot), a
    # backticked reserved word in CREATE TABLE and in none of the five
    # statements using it, and three tables missing the comma before their first
    # inline KEY.
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        # mongo:8 has no HEALTHCHECK of its own, so wait on a real ping rather
        # than on the container merely being up — a test that connects too early
        # fails in a way that looks like a code bug.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: daycore
          POSTGRES_USER: daycore
          POSTGRES_DB: daycore
        options: >-
          --health-cmd "pg_isready -U daycore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: daycore
          MYSQL_DATABASE: daycore
        # mysqladmin ping answers before the server accepts real connections, so
        # authenticate as part of the check — otherwise the first test connects
        # into a half-open server and fails in a way that looks like a code bug.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdaycore --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      MONGO_TEST_DSN: mongodb://127.0.0.1:27017
      # The suites create and drop their own schema/database per case, so these
      # point at the server, not at the data.
      PG_TEST_DSN: postgres://daycore:daycore@127.0.0.1:5432/daycore?sslmode=disable
      MYSQL_TEST_DSN: root:daycore@tcp(127.0.0.1:3306)/daycore?parseTime=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      # api/openapi.yaml is the contract every frontend generates types from, so
      # a parse error there breaks four repos at once. It went unnoticed for a
      # while precisely because nothing checked it — three unquoted scalars
      # containing ": " or "{" made the whole file unloadable.
      - name: openapi parses, and matches the Go structs
        run: |
          python3 - <<'PY'
          import re, sys, yaml

          try:
              spec = yaml.safe_load(open("api/openapi.yaml"))
          except Exception as e:
              print(f"::error file=api/openapi.yaml::not valid YAML: {e}")
              sys.exit(1)

          ops = sum(len([m for m in v if m in ("get","post","put","patch","delete")])
                    for v in spec["paths"].values())
          print(f"openapi: {len(spec['paths'])} paths / {ops} operations")

          # Every json-tagged field on these structs must exist in the schema.
          # Adding a field to the domain and forgetting the contract is the exact
          # mistake this guards against.
          pairs = [("TimeBlock", "internal/domain/plan.go", "TimeBlock"),
                   ("OperationLog", "internal/domain/operations.go", "OperationLog")]
          failed = False
          for schema, path, gotype in pairs:
              body = re.search(rf"type {gotype} struct \{{(.*?)\n\}}", open(path).read(), re.S).group(1)
              tags = {t.split(",")[0] for t in re.findall(r'json:"([^"]+)"', body)} - {"-"}
              props = set(spec["components"]["schemas"][schema]["properties"])
              missing = sorted(tags - props)
              if missing:
                  failed = True
                  print(f"::error file=api/openapi.yaml::{schema} is missing fields "
                        f"present on Go {gotype}: {', '.join(missing)}")
          sys.exit(1 if failed else 0)
          PY

      - name: go vet
        run: go vet ./...

      - name: go test
        # MONGO_TEST_DSN is set at the job level, so the conformance suite runs
        # against both SQLite and the real MongoDB in one pass. Without it the
        # Mongo half skips itself silently, which is how it went untested for
        # months.
        run: go test ./...

      - name: assert the SQL conformance suites actually ran
        # The whole point of the two new services is executing the DDL against a
        # real server. A skipped suite reads as a passing one, and these DSNs are
        # exactly the kind of thing that quietly stops being set.
        run: |
          out=$(go test -count=1 -run 'TestConformancePostgres|TestConformanceMySQL' -v ./internal/storage/sqlstore/ 2>&1)
          echo "$out" | tail -60
          for name in TestConformancePostgres TestConformanceMySQL; do
            if echo "$out" | grep -q "SKIP: $name"; then
              echo "::error::$name skipped itself — its DSN is not reaching the test"
              exit 1
            fi
            if ! echo "$out" | grep -qE "PASS: $name/Lease"; then
              echo "::error::$name did not run its cases"
              exit 1
            fi
          done

      - name: assert the Mongo conformance suite actually ran
        # A skipped suite reads as a passing one, and MONGO_TEST_DSN is exactly
        # the kind of thing that quietly stops being set. Fail loudly instead.
        run: |
          out=$(go test -count=1 -run TestConformance -v ./internal/storage/mongostore/ 2>&1)
          echo "$out" | tail -40
          if echo "$out" | grep -q 'SKIP'; then
            echo "::error::the MongoDB conformance suite skipped itself — MONGO_TEST_DSN is not reaching the test"
            exit 1
          fi
          if ! echo "$out" | grep -qE 'PASS: TestConformance/Lease'; then
            echo "::error::the MongoDB conformance suite did not run its cases"
            exit 1
          fi

      - name: Build static binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/daycore ./cmd/daycore

      - uses: actions/upload-artifact@v4
        with:
          name: daycore-linux-amd64
          path: bin/daycore
          if-no-files-found: error

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        working-directory: web/frontend
        run: npm ci

      # zh-CN / en-US key sets must stay aligned — a missing key is a runtime
      # crash, so this gates the build rather than merely warning.
      - name: i18n key check
        run: node web/frontend/scripts/check-i18n.mjs

      - name: Build
        working-directory: web/frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: daycore-frontend-dist
          path: web/frontend/dist
          if-no-files-found: error

  extension:
    name: Chrome extension (MV3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No bundler here — the extension is plain MV3 files. Validate instead of
      # compiling: JSON must parse, and every data-i18n / t("…") key referenced
      # by the UI must exist in BOTH locales.
      - name: Validate manifest and locales
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const read = (p) => JSON.parse(readFileSync(`extension/${p}`, "utf8"));
            const manifest = read("manifest.json");
            if (manifest.manifest_version !== 3) throw new Error("expected MV3");

            const zh = read("_locales/zh_CN/messages.json");
            const en = read("_locales/en/messages.json");
            const missing = [
              ...Object.keys(zh).filter((k) => !en[k]).map((k) => `en is missing ${k}`),
              ...Object.keys(en).filter((k) => !zh[k]).map((k) => `zh_CN is missing ${k}`),
            ];

            for (const key of Object.keys(zh)) {
              const a = Object.keys(zh[key].placeholders ?? {}).sort().join(",");
              const b = Object.keys(en[key]?.placeholders ?? {}).sort().join(",");
              if (a !== b) missing.push(`placeholder mismatch on ${key}: [${a}] vs [${b}]`);
            }

            const used = new Set();
            for (const f of ["popup.html", "options.html"]) {
              const html = readFileSync(`extension/${f}`, "utf8");
              for (const m of html.matchAll(/data-i18n="([^"]+)"/g)) used.add(m[1]);
            }
            for (const f of ["popup.js", "options.js"]) {
              const js = readFileSync(`extension/${f}`, "utf8");
              for (const m of js.matchAll(/\bt\("([A-Za-z0-9_]+)"/g)) used.add(m[1]);
            }
            for (const k of used) if (!zh[k]) missing.push(`message key used but undefined: ${k}`);

            if (missing.length) {
              console.error("::error::" + missing.join("; "));
              process.exit(1);
            }
            console.log(`OK — MV3 manifest v${manifest.version}, ${Object.keys(zh).length} keys x 2 locales`);
          '

      - name: Package
        run: |
          mkdir -p dist
          (cd extension && zip -qr ../dist/daycore-extension.zip . -x '*.DS_Store')
          unzip -l dist/daycore-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: daycore-extension
          path: dist/daycore-extension.zip
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Build only — no registry push. Proves deploy/Dockerfile still works.
      - name: Build image
        run: docker build -f deploy/Dockerfile -t daycore:ci .
