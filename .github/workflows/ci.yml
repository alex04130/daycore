name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      # api/openapi.yaml is the contract every frontend generates types from, so
      # a parse error there breaks four repos at once. It went unnoticed for a
      # while precisely because nothing checked it — three unquoted scalars
      # containing ": " or "{" made the whole file unloadable.
      - name: openapi parses, and matches the Go structs
        run: |
          python3 - <<'PY'
          import re, sys, yaml

          try:
              spec = yaml.safe_load(open("api/openapi.yaml"))
          except Exception as e:
              print(f"::error file=api/openapi.yaml::not valid YAML: {e}")
              sys.exit(1)

          ops = sum(len([m for m in v if m in ("get","post","put","patch","delete")])
                    for v in spec["paths"].values())
          print(f"openapi: {len(spec['paths'])} paths / {ops} operations")

          # Every json-tagged field on these structs must exist in the schema.
          # Adding a field to the domain and forgetting the contract is the exact
          # mistake this guards against.
          pairs = [("TimeBlock", "internal/domain/plan.go", "TimeBlock"),
                   ("OperationLog", "internal/domain/operations.go", "OperationLog")]
          failed = False
          for schema, path, gotype in pairs:
              body = re.search(rf"type {gotype} struct \{{(.*?)\n\}}", open(path).read(), re.S).group(1)
              tags = {t.split(",")[0] for t in re.findall(r'json:"([^"]+)"', body)} - {"-"}
              props = set(spec["components"]["schemas"][schema]["properties"])
              missing = sorted(tags - props)
              if missing:
                  failed = True
                  print(f"::error file=api/openapi.yaml::{schema} is missing fields "
                        f"present on Go {gotype}: {', '.join(missing)}")
          sys.exit(1 if failed else 0)
          PY

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/daycore ./cmd/daycore

      - uses: actions/upload-artifact@v4
        with:
          name: daycore-linux-amd64
          path: bin/daycore
          if-no-files-found: error

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        working-directory: web/frontend
        run: npm ci

      # zh-CN / en-US key sets must stay aligned — a missing key is a runtime
      # crash, so this gates the build rather than merely warning.
      - name: i18n key check
        run: node web/frontend/scripts/check-i18n.mjs

      - name: Build
        working-directory: web/frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: daycore-frontend-dist
          path: web/frontend/dist
          if-no-files-found: error

  extension:
    name: Chrome extension (MV3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No bundler here — the extension is plain MV3 files. Validate instead of
      # compiling: JSON must parse, and every data-i18n / t("…") key referenced
      # by the UI must exist in BOTH locales.
      - name: Validate manifest and locales
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const read = (p) => JSON.parse(readFileSync(`extension/${p}`, "utf8"));
            const manifest = read("manifest.json");
            if (manifest.manifest_version !== 3) throw new Error("expected MV3");

            const zh = read("_locales/zh_CN/messages.json");
            const en = read("_locales/en/messages.json");
            const missing = [
              ...Object.keys(zh).filter((k) => !en[k]).map((k) => `en is missing ${k}`),
              ...Object.keys(en).filter((k) => !zh[k]).map((k) => `zh_CN is missing ${k}`),
            ];

            for (const key of Object.keys(zh)) {
              const a = Object.keys(zh[key].placeholders ?? {}).sort().join(",");
              const b = Object.keys(en[key]?.placeholders ?? {}).sort().join(",");
              if (a !== b) missing.push(`placeholder mismatch on ${key}: [${a}] vs [${b}]`);
            }

            const used = new Set();
            for (const f of ["popup.html", "options.html"]) {
              const html = readFileSync(`extension/${f}`, "utf8");
              for (const m of html.matchAll(/data-i18n="([^"]+)"/g)) used.add(m[1]);
            }
            for (const f of ["popup.js", "options.js"]) {
              const js = readFileSync(`extension/${f}`, "utf8");
              for (const m of js.matchAll(/\bt\("([A-Za-z0-9_]+)"/g)) used.add(m[1]);
            }
            for (const k of used) if (!zh[k]) missing.push(`message key used but undefined: ${k}`);

            if (missing.length) {
              console.error("::error::" + missing.join("; "));
              process.exit(1);
            }
            console.log(`OK — MV3 manifest v${manifest.version}, ${Object.keys(zh).length} keys x 2 locales`);
          '

      - name: Package
        run: |
          mkdir -p dist
          (cd extension && zip -qr ../dist/daycore-extension.zip . -x '*.DS_Store')
          unzip -l dist/daycore-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: daycore-extension
          path: dist/daycore-extension.zip
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Build only — no registry push. Proves deploy/Dockerfile still works.
      - name: Build image
        run: docker build -f deploy/Dockerfile -t daycore:ci .
