# nginx — serve the (Claude Design-built) frontend at / and reverse-proxy the
# Go API at /api on the same origin, so the httpOnly cookies just work and no
# CORS is needed. SSE (companion chat) requires proxy_buffering off.
#
# Put the frontend build output (e.g. Vite `dist/`) at /usr/share/nginx/html.

upstream daycore_api {
    server app:8080;   # docker-compose service name (or 127.0.0.1:8080)
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the static frontend
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed assets → cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + SSE
    location /api/ {
        proxy_pass http://daycore_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (POST /api/ai/companion): stream, don't buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
