/api/admin/config:
  get:
    operationId: adminConfigGet
    tags: [admin]
    summary: Every configuration knob, both layers, with where its value came from.
    description: >-
      Two layers, and the console may only write one. BOOT settings built
      something at startup — a socket, a database handle, a signing key — so a
      new value cannot change the thing already built; they are shown read-only.
      RUNTIME settings are read fresh at each use, so an override takes effect on
      the next read.

      `source` says whether the active value came from the environment seed or
      from a stored override, which is what makes a meaningful reset control
      possible.

      `requiresRestart` marks a knob that is runtime BY NATURE but whose value
      was copied into something at construction (the rate limiters, the model
      catalog, the weather chain). Storing the override is accepted and correct;
      it simply will not take effect until a restart, and the console should say
      so rather than imply the change is live.

      SECRETS ARE NEVER RETURNED — not the value, not a prefix, not a length. A
      masked secret still leaks how long it is and whether it changed between two
      reads. `set` says whether it is configured, which is all the console needs.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: array
                  items:
                    type: object
                    properties:
                      env: { type: string, description: The environment variable name. }
                      key: { type: string, description: "The Config field — this is what PUT takes." }
                      layer: { type: string, enum: [boot, runtime] }
                      value: { type: string, description: Absent for secrets. }
                      set: { type: boolean, description: "Configured at all; the only answer given for a secret." }
                      secret: { type: boolean }
                      source: { type: string, enum: [env, override] }
                      editable: { type: boolean, description: "layer==runtime and not a secret." }
                      why: { type: string, description: Why a surprising classification is what it is. }
                      requiresRestart: { type: boolean }
      '401': { description: No admin credential. }
  put:
    operationId: adminConfigPut
    tags: [admin]
    summary: Set or reset runtime overrides.
    description: >-
      `{"settings": {"MaxUploadBytes": "8388608", "AgentMaxRounds": null}}` —
      a string sets the override, NULL resets the key to its environment seed.
      Those are deliberately different from `""`: for a string knob "back to the
      default" and "set it to nothing" are different requests, and a console with
      only one of them cannot undo a mistake.

      The whole request is validated before any of it is written. A partial apply
      would leave the operator with some edits in place and no way to tell which,
      and there is no transaction to offer them.

      Boot-layer and secret keys are refused with a reason rather than stored —
      a row the console displays and the process ignores is the worst outcome
      available here.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [settings]
            properties:
              settings:
                type: object
                additionalProperties: { type: string, nullable: true }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                ok: { type: boolean }
                requiresRestart:
                  type: array
                  items: { type: string }
                  description: "Keys whose new value waits for a restart. Per key, not one boolean — the operator's next question is WHICH one."
      '400': { description: "unknown_setting, not_editable, or bad_value." }
      '401': { description: No admin credential. }
      '503': { description: "degraded — storage is unavailable, so overrides cannot be written. The environment layer still applies." }
/api/admin/session:
  post:
    operationId: adminLogin
    tags: [admin]
    summary: Exchange the raw admin token for a short-lived console cookie.
    description: >-
      TWO WAYS INTO THE ADMIN API, for two callers. Machines (curl, CI, deploy
      scripts) keep sending `X-Admin-Token` on every request — that path is
      unchanged and was never the problem: the token is in a header rather than
      a URL and the comparison is constant-time.

      Humans use this endpoint once and get `dc_admin`: httpOnly (an XSS on the
      console cannot read it), Secure, SameSite=Strict, and short-lived. What it
      fixes is that the console used to keep the raw token in sessionStorage,
      where any XSS could read a credential that never expired and could only be
      rotated by redeploying.

      The cookie carries NO revocation mechanism — there is no admin account to
      bump a token version on, and the console must keep working when storage is
      down — so its TTL is its revocation. Logging out clears the cookie;
      a copy taken beforehand stays valid until it expires.

      CSRF: SameSite=Strict plus an Origin check, because a cookie rides along on
      cross-site requests and httpOnly buys confidentiality rather than
      authority. The header path needs neither — a custom header forces a
      preflight.

      ⚠️ An unset ADMIN_TOKEN no longer means "open outside production". The
      server generates one at startup and prints it; there is no unauthenticated
      state to fall into.
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
    responses:
      '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, expiresIn: { type: integer, description: seconds } } } } } }
      '401': { description: Wrong token. }
      '403': { description: Cross-origin request. }
      '429': { description: Rate limited (shares the auth limiter). }
  delete:
    operationId: adminLogout
    tags: [admin]
    summary: Clear the console cookie.
    description: Deliberately open — a logout that 401s leaves somebody unable to clear a session they cannot use.
    responses:
      '200': { description: OK }
/api/admin/prompts:
  get: { operationId: adminListPrompts, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Error' } } }
/api/admin/prompts/{key}:
  get:
    operationId: adminGetPrompt
    tags: [admin]
    security: [{ adminToken: [] }]
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }, { name: locale, in: query, schema: { type: string } }]
    responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
  put:
    operationId: adminSetPrompt
    tags: [admin]
    security: [{ adminToken: [] }]
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }, { name: locale, in: query, schema: { type: string } }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string } } } } } }
    responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
/api/admin/stats:
  get: { operationId: adminStats, tags: [admin], security: [{ adminToken: [] }], summary: Dashboard aggregation (incl. feedbackUseful/feedbackTotal)., responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStats' } } } } } }
/api/admin/ailogs:
  get: { operationId: adminAILogs, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK } } }
/api/admin/users:
  get: { operationId: adminUsers, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK } } }
/api/admin/users/{id}:
  delete: { operationId: adminDeleteUser, tags: [admin], security: [{ adminToken: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
/api/admin/db/tables:
  get: { operationId: adminDBTables, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK } } }
/api/admin/db/table/{name}:
  get: { operationId: adminDBBrowse, tags: [admin], security: [{ adminToken: [] }], parameters: [{ name: name, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
/api/admin/db/table/{name}/{id}:
  delete: { operationId: adminDBDelete, tags: [admin], security: [{ adminToken: [] }], parameters: [{ name: name, in: path, required: true, schema: { type: string } }, { name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
/api/admin/db/export:
  get: { operationId: adminDBExport, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK } } }
/api/admin/db/import:
  post: { operationId: adminDBImport, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK } } }
/api/admin/db/backup:
  get: { operationId: adminDBBackup, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK } } }
/api/admin/providers:
  get:
    operationId: adminProvidersGet
    tags: [admin]
    security: [{ adminToken: [] }]
    summary: External capability sources, with health
    description: >
      Every configured weather / search source, including disabled and unhealthy
      ones — those are usually the ones being asked about.


      Only three fields are writable (enabled, description, approved);
      `editable` lists them. Identity and wiring — id, format, base_url,
      token_env — live in config/providers.yaml and are file-only. That is F1's
      rule applied per field: the process built an HTTP client out of base_url at
      startup, so a new value cannot change the thing already built. base_url has
      a second reason — it is the SSRF entrance, and requiring shell access to
      change it is the whole defence.


      `health` is PER PROCESS by design and never persisted: an adapter is often
      same-host, so what one instance cannot reach another may reach fine. Two
      consoles legitimately disagree, which is why `instance` names which one
      answered.


      No secret appears. `tokenEnv` is the variable NAME and `tokenSet` says
      whether it currently holds anything — never the value, a prefix, or a
      length.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                providers: { type: array, items: { $ref: '#/components/schemas/ProviderView' } }
                configPath: { type: string, description: The file to edit for the fields this screen cannot touch. }
                instance: { type: string }
      '401': { description: No admin credential. }
  put:
    operationId: adminProvidersPut
    tags: [admin]
    security: [{ adminToken: [] }]
    summary: Set enabled / description / approved on one or more sources
    description: >
      A sparse patch: a field the console does not send keeps what it had. The
      whole request is validated before any of it is written, because there is no
      transaction and a partial apply leaves the operator with some edits in
      place and no way to tell which.


      `approved` means "an operator has read this text", and it is recorded
      against a HASH of the description being approved — so editing the
      description revokes its approval automatically. Without that the gate would
      be one edit away from decorative and nothing anywhere would go red. An
      unapproved source still works; the model is told about it in a sentence the
      backend builds from its id and format rather than in the operator's words.


      An adapter's own self-reported description is NEVER injected and the server
      has no path that promotes it into this field. It appears separately as
      `manifestDescription` so an operator can read it and choose to adopt it,
      which records an approval like any other.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [providers]
            properties:
              providers:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [kind, id]
                  properties:
                    kind: { type: string, enum: [weather, search, channel] }
                    id: { type: string }
                    enabled: { type: boolean }
                    description:
                      type: object
                      additionalProperties: { type: string }
                      description: Per locale. Both zh-CN and en-US are required — one language only vanishes for half the users.
                    approved: { type: boolean }
    responses:
      '200':
        description: OK, with the refreshed list
        content:
          application/json:
            schema:
              type: object
              properties:
                ok: { type: boolean }
                providers: { type: array, items: { $ref: '#/components/schemas/ProviderView' } }
      '400': { description: Unknown source, or a description that is not in both locales. }
      '401': { description: No admin credential. }
      '503': { description: Degraded — the override table is in the database. }
