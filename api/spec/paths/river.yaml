/api/river:
  get:
    operationId: getRiver
    tags: [river]
    summary: The activity river — one row per day, oldest first.
    description: >
      The last `days` days inclusive of today, folded into one row per day.
      `count` is how many operation_logs rows were created that UTC day;
      `mood` is the emoji of the day's newest resolvable mood check-in
      (empty when there is none). Days with no activity still appear — the
      band is continuous, and an empty day is a fact rather than a hole.
    parameters:
      - name: days
        in: query
        required: false
        schema: { type: integer, default: 15, minimum: 1, maximum: 90 }
        description: How many days back to return (inclusive of today).
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, example: "2026-08-14" }
                  count: { type: integer, example: 7 }
                  mood: { type: string, example: "😌" }
