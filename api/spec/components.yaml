components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: dc_sid }
    authCookie: { type: apiKey, in: cookie, name: dc_auth }
    sessionToken: { type: apiKey, in: header, name: X-Session-Token, description: "Same signed value as the dc_sid cookie, for clients without a cookie jar. Get it from POST /api/session/init {tokenInBody:true}." }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: "Same JWT as the dc_auth cookie. Get it from login/register {tokenInBody:true}; logout revokes all issued JWTs (token-version bump)." }
    importToken: { type: apiKey, in: header, name: X-Import-Token, description: "Session-scoped token for the browser extension's direct push." }
    adminToken: { type: apiKey, in: header, name: X-Admin-Token, description: "Admin endpoints." }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: "Stable code the frontend translates (e.g. no_session, bad_request, rate_limited, token_expired)." }
        message: { type: string, description: "Localized fallback message." }
    TimeBlock:
      type: object
      required: [id, title, type, time_mode, timezone]
      properties:
        id: { type: string }
        date: { type: string, example: "2026-07-13", description: "YYYY-MM-DD" }
        time: { type: string, nullable: true, example: "14:30", description: "HH:MM or null when unscheduled" }
        title: { type: string }
        type: { type: string, enum: [task, appointment, break, relax, meal] }
        duration_min: { type: integer, nullable: true }
        time_mode: { type: string, enum: [floating, fixed, local], description: "floating=wall clock (no utc_time); fixed=absolute instant; local=circadian, follows current tz. fixed/local carry utc_time." }
        timezone:
          type: string
          example: "Asia/Shanghai"
          description: >
            The EVENT's zone — whose wall clocks this rule's time belongs to.
            A different question from Preferences.timezone, which is where the
            user is now: a lecture imported from a Shanghai timetable stays
            09:00 中国时间 when the student is in London, and the two layers are
            what make that expressible. Empty means floating (whatever the
            reader's own zone says), which is right for "gym at 7" and wrong for
            a class in another country. Set by ICS import from X-WR-TIMEZONE and
            correctable here; a name this build cannot load is rejected.
        utc_time: { type: string, nullable: true, description: "RFC3339 UTC anchor for fixed/local blocks." }
        offset_min: { type: integer, nullable: true }
        offset_ref: { type: string }
        completed: { type: boolean }
        isAchievement: { type: boolean }
        rule_id: { type: string, description: "Set when the block is an occurrence of a ScheduleRule." }
        origin: { type: string, enum: [auto, manual, rule], description: "auto=generated (dashed border, replaced on re-plan); manual=user (survives); rule=materialized occurrence." }
        hidden: { type: boolean, description: "Tombstone — filtered out of reads; never render." }
        note: { type: string, description: "Whatever the user felt like writing when checking the block off — how it went, what was left half-done. Always optional; never prompted for. The agent reads it." }
        lock_level:
          type: string
          enum: ["", none, soft, hard]
          description: >-
            How firmly the time slot is fixed. THREE states, not two: "" means
            never derived yet (the server will fill it in on read), none means
            derived and free to move. hard=set by a timetable, the user cannot
            move it; soft=agreed with someone else, moving needs confirmation.
            Derivation rule and the shared case table live in api/lock-rules.json.
        lock_reason: { type: string, description: "Why it is locked. Derived reasons are looked up per request locale; a user-set reason is stored verbatim." }
        lock_source:
          type: string
          enum: ["", derived, user, agent]
          description: >-
            Who decided the lock. derived=inferred from type+title and safe to
            recompute; user/agent=a deliberate choice, never recomputed. Without
            this a hand-unlocked class would be re-locked on every read.
        rescheduled_from: { type: string, description: "Id of the block this one was re-fished from, chaining each retry back to the original." }
        reschedule_count: { type: integer, description: "How many times this item has been offered a new slot. Past the configured limit the agent stops offering and records the preference instead." }
    DayPlan:
      type: object
      properties:
        id: { type: string, description: "Empty for synthetic rules-only days." }
        sessionId: { type: string }
        date: { type: string }
        blocks: { type: array, items: { $ref: '#/components/schemas/TimeBlock' } }
        sourceType: { type: string, enum: [text, image, auto, rules] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [add, update, remove] }
        match: { type: object, additionalProperties: true, description: "e.g. {id}" }
        changes: { type: object, additionalProperties: true }
        confirm:
          type: boolean
          description: >-
            The way through a soft lock: the user was told this one was agreed
            with someone else and said go ahead. Does nothing for a hard lock or
            a petrified block — those have no way through, and a flag that
            opened them would make the gate advisory. See docs/specs/plan-semantics.md.
    Proposal:
      type: object
      description: >-
        Everything the agent wants to do but has not done — or has done and is
        still offering to undo. Ghosts, cards, decision cards and channel
        approvals are all this, seen from different ends. Semantics in
        docs/specs/plan-semantics.md §three.
      properties:
        id: { type: string }
        state:
          type: string
          enum: [pending, accepted, rejected, expired]
          description: >-
            Four, not three. A silent expiry must stay distinguishable from a
            deliberate no — the ledger keeps everything, and an expired offer
            was never seen.
        level:
          type: string
          enum: [L1, L2, L3]
          description: >-
            The attention ladder — the MEDIUM. L1 an in-view ghost bound to a
            slot, L2 a card in the stack, L3 a push against the ≤3/day budget.
            L0 never becomes a proposal. Independent of whether the proposal may
            ESCALATE, which is decided by what it rests on (see origin/btype):
            a hard-backed one — an appointment, a deadline — may come back louder
            as the moment approaches; a soft one gets one delivery, ever, because
            "ignoring is always safe" is a promise and escalation would break it.
            The distinction is derived server-side from the row, never asserted
            by the agent: "is this important" is exactly the judgement a model
            gets wrong in the direction of interrupting more.
        kind: { type: string, enum: [timed, card, decision] }
        title: { type: string }
        summary: { type: string }
        reason: { type: string }
        evidence: { type: string }
        date: { type: string }
        start: { type: string, description: "HH:MM" }
        dur: { type: integer, nullable: true }
        btype:
          type: string
          description: >-
            The block type this proposal is about. "appointment" is the only
            HARD one today — a slot somebody else is also holding — and future
            hard types (meeting, flight, exam) join that set rather than adding a
            field. task/break/relax/meal are the user's own intentions about
            their own day. Deliberately NOT the same as lockLevel: a lock says
            "this cannot move", hardness says "missing this costs somebody other
            than you".
        lockLevel: { type: string }
        lockReason: { type: string }
        rows:
          type: array
          description: A compound card, each line accepted or rejected on its own.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              state: { type: string, enum: [pending, accepted, rejected, expired] }
        sessionId: { type: string }
        mergeKey: { type: string, description: Same key → only the newest undelivered survives. }
        deliverAfter: { type: string, format: date-time }
        deliveredAt:
          type: string
          format: date-time
          description: >-
            A PERMANENT stamp; nothing clears it. "How many cards are in the
            stack" is a conjunction (pending + delivered + still deliverable),
            not a question about this field.
        pushedAt: { type: string, format: date-time, description: What the ≤3/day push budget counts. }
        ttlPolicy:
          type: string
          enum: [silence_accepts, silence_rejects]
          description: >-
            Acted first → silence confirms; asked first → silence voids.
            Backwards, one of these executes unattended work and the other
            discards an undo window.
        expiresAt: { type: string, format: date-time }
        resolution: { type: string, enum: [user, silence, superseded] }
        origin:
          type: string
          enum: [agent, daemon, upload, protector, user, deadline]
          description: >-
            Which part of the system produced it. "deadline" is the fact track —
            a due date the user or an import put there, the archetypal hard fact,
            and the one origin that licenses escalation. "user" means the user
            asked for this card; it matters for the ledger, since a summoned card
            should not count against rapport the way an unsolicited one does.
        threadId: { type: string }
        rev: { type: integer, description: Optimistic concurrency — row-level accepts race otherwise. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanBlocked:
      type: object
      description: >-
        409 body when the plan gate refuses a write. 409 rather than 403 because
        nothing about the caller is wrong — the request conflicts with the state
        of the block it names, and that state can change.
      required: [error, code, message, blockId, confirmable]
      properties:
        error: { type: string, enum: [blocked] }
        code:
          type: string
          enum: [locked, petrified]
          description: Which rule refused. `petrified` means the day has turned; `locked` means the slot is not the user's to move.
        message: { type: string, description: Localized, ready to show. }
        blockId: { type: string }
        confirmable:
          type: boolean
          description: Re-sending with `action.confirm` would succeed. True only for soft locks.
        lockLevel: { type: string, enum: [hard, soft], description: Absent for a petrify refusal. }
        lockReason: { type: string, description: Absent for a petrify refusal. }
        block: { $ref: '#/components/schemas/TimeBlock' }
    ModelDetail:
      type: object
      properties:
        id: { type: string, description: OUR stable name — what DEFAULT_CHAT_MODEL and the database reference. }
        format: { type: string }
        baseUrl: { type: string, description: Where requests go. "Which gateway is this actually hitting" is the second question after "is the key set". }
        model: { type: string, description: The vendor's name — the perishable half. Shown next to id because that pair is the whole point of having two fields. }
        apiKeyEnv: { type: string, description: The variable NAME. Not a credential. }
        keySet: { type: boolean, description: Whether a key was resolved at all. The value never appears. }
        caps: { type: object, additionalProperties: true }
        roles:
          type: array
          items: { type: string, enum: [chat, vision, planner] }
          description: The default slots this entry currently fills. Derived, so it cannot disagree with what the process is doing — planner reports where it actually lands, including its fallback to the chat model.

    OAuthProviderView:
      type: object
      properties:
        name: { type: string }
        clientId: { type: string, description: Not a secret — it travels in the authorize URL of every login. }
        secretSet: { type: boolean, description: The only thing said about the secret. An id with no secret fails at the token exchange, after the user has already left and come back. }
        redirectUri: { type: string, description: The callback the vendor must have registered. Built by the same function the login flow uses. }
        preset: { type: boolean, description: URLs and field mappings came from a built-in template, which is why a two-line entry works. }

    ProviderView:
      type: object
      properties:
        kind: { type: string, enum: [weather, search, channel] }
        id: { type: string }
        format: { type: string, enum: [builtin, http] }
        impl: { type: string, description: 'For format builtin: the compiled-in implementation.' }
        baseUrl: { type: string, description: For format http. File-only — it is the SSRF entrance. }
        tokenEnv: { type: string, description: The environment variable NAME. Not a credential. }
        tokenSet: { type: boolean, description: Whether that variable currently holds anything. The value never appears. }
        displayName: { type: string }
        logo: { type: string, description: A raster data URI or empty. SVG is refused — it can carry script, and channel logos render in ordinary user clients. }
        enabled: { type: boolean }
        editable: { type: array, items: { type: string }, description: Precomputed so the console does not re-derive a rule that lives on the server. }
        description: { type: object, additionalProperties: { type: string } }
        manifestDescription:
          type: object
          additionalProperties: { type: string }
          description: What the ADAPTER says about itself. Shown as a suggestion; never injected into a prompt and never merged into description.
        approved: { type: boolean }
        health:
          type: object
          properties:
            up: { type: boolean }
            reason: { type: string }
            lastChecked: { type: string, format: date-time }
            failures: { type: integer }
            backoffUntil: { type: string, format: date-time }
        instance: { type: string, description: Which process answered. Health is per process. }
    Session:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        interactionCount: { type: integer }
        signInPrompted: { type: boolean }
        assistantName: { type: string }
        currentTheme: { type: string }
        language: { type: string, enum: [zh-CN, en-US] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Preferences:
      type: object
      properties:
        morningBrief: { type: boolean }
        eveningReview: { type: boolean }
        deadlineAlerts: { type: boolean }
        rollingReplan: { type: boolean }
        gapSuggestions: { type: boolean }
        doNotDisturb: { type: boolean }
        autoPlan: { type: boolean }
        materialCategories:
          type: object
          additionalProperties: { type: boolean }
          description: "Per-category enablement overrides (id → on/off); missing = registry default. Unknown ids and note:false are rejected (400 bad_category)."
        timezone:
          type: string
          description: >
            The IANA zone this user's own day is measured in — it decides when
            the petrify line falls, where their rhythm day boundary sits, and
            what time the morning brief arrives. Empty means "follow the device,
            and until it reports, the deployment default" (WORKER_DEFAULT_TZ).
            Setting it here is the USER choosing, which outranks whatever their
            device reports from then on; send "" to go back to following the
            device. A client also reports its zone implicitly via the timezone
            field on POST /api/ai/companion, which fills in or updates a
            device-detected value but never overwrites this one. 400
            bad_timezone if it is not a zone this build can load.
        timezoneSource:
          type: string
          enum: ["", user, detected]
          readOnly: true
          description: "Who decided the timezone. Read-only — it is set by which door the value came in through."
        location:
          type: string
          maxLength: 128
          description: >
            Where this user is, as free text a weather source can resolve
            ("北京", "Cambridge, MA"). It exists for ONE caller: the morning and
            evening briefs, which look up the weather with no model in the loop
            and therefore cannot ask anybody where to look. The chat tool takes
            a location as an argument, so the model can already ask about
            anywhere — a trip's destination, next week's city — and needs
            nothing stored.

            Same precedence as timezone: setting it here is the USER choosing
            and outranks the client's reports from then on; "" goes back to
            following the client. A client reports its place via the location
            field on POST /api/ai/companion.

            When nothing is known — no setting, and no memory fact stating a
            home — the brief simply has NO weather line. That is deliberate: a
            wrong city is worse than no city, because "17°C and raining" is a
            sentence somebody dresses by.

            Free text rather than coordinates because every weather source here
            resolves a place name itself; geocoding server-side would mean
            owning a geocoder and disagreeing with the source.
        locationSource:
          type: string
          enum: ["", user, detected]
          readOnly: true
          description: "Who decided the location. Read-only, like timezoneSource."
        primaryLocale:
          type: string
          description: >
            This user's main language. Empty means "use the deployment default"
            (GET /api/version locales.defaultPrimary), which is the common case.
            Any locale in locales.available is a legal choice.
        secondaryLocale:
          type: string
          description: >
            The language the home-page switch flips to. Send "" to drop the
            switch entirely. Must differ from primaryLocale — a toggle between a
            language and itself is a control that does nothing (400
            unsupported_locale). The two are validated as a pair, so send both
            when changing both. Changing the pair realigns
            /api/session.language into it when the current value falls outside.
    ScheduleRule:
      type: object
      required: [id, title, type, time_mode, kind, active]
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        type: { type: string, enum: [task, appointment, break, relax, meal] }
        time: { type: string, nullable: true }
        duration_min: { type: integer, nullable: true }
        timezone: { type: string }
        time_mode: { type: string, enum: [floating, fixed, local] }
        kind: { type: string, enum: [once, recurring] }
        date: { type: string, nullable: true }
        freq: { type: string, enum: [daily, weekly, monthly, every_n_days] }
        interval: { type: integer, minimum: 1 }
        by_weekday: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        start_date: { type: string }
        until: { type: string, nullable: true }
        active: { type: boolean }
        source: { type: string, enum: [user, chat, ics, image, canvas] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        type: { type: string, enum: [task, appointment, break, relax, meal], default: task }
        time: { type: string, nullable: true }
        duration_min: { type: integer, nullable: true }
        timezone: { type: string }
        time_mode: { type: string, enum: [floating, fixed, local], default: floating }
        kind: { type: string, enum: [once, recurring], default: recurring }
        date: { type: string, nullable: true }
        freq: { type: string, enum: [daily, weekly, monthly, every_n_days] }
        interval: { type: integer, minimum: 1, default: 1 }
        by_weekday: { type: array, items: { type: integer } }
        start_date: { type: string }
        until: { type: string, nullable: true }
        active: { type: boolean, default: true }
        source: { type: string, enum: [user, chat, ics, image, canvas], default: user }
        note: { type: string, nullable: true }
    Material:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        category: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        source: { type: string }
        mime_type: { type: string }
        storage_ref: { type: string }
        tags: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SearchResult:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        score: { type: number }
    Wish:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        note: { type: string }
        effortMin: { type: integer }
        status: { type: string, enum: [active, done, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatThread:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        summary: { type: string }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        threadId: { type: string }
        sessionId: { type: string }
        role: { type: string, enum: [user, assistant, system, tool] }
        content: { type: string }
        toolEvents: { type: string, description: "JSON array of SSE v2 frames (tool_start/tool_result/decision_card/error) for replay." }
        status: { type: string, enum: ["", pending, done, error], description: "Async turn state. Empty (rows predating the field) reads as done. pending = agent still running (a decision_card may appear in toolEvents while pending — answer via POST /api/decisions/{id}/respond)." }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: "Files sent with this message. Hydrated on read from their own table — not a column." }
        createdAt: { type: string, format: date-time }
    Attachment:
      type: object
      description: >-
        A file on the bus, addressed by id. The storage ref is deliberately
        absent from this schema and from every response: it is a bearer handle
        minted by a store that has no notion of who is asking, so the server
        resolves id → ref itself after checking the session.
      properties:
        id: { type: string }
        sessionId: { type: string }
        threadId: { type: string, description: "Set once bound to a message." }
        messageId: { type: string, description: "Empty while the upload has not been sent." }
        kind: { type: string, enum: [image, audio, video, document, file], description: "What to render. A closed set so a client never has to know that image/avif is an image." }
        mime: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, description: "Of the stored bytes; also the ETag on download." }
        filename: { type: string }
        createdAt: { type: string, format: date-time }
    CustomTheme:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        base: { type: string }
        dark: { type: boolean }
        variables: { type: object, additionalProperties: { type: string }, description: "CSS variable whitelist; color literals only (server-validated)." }
    Course:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        canvasId: { type: string }
        name: { type: string }
        courseCode: { type: string }
        currentScore: { type: number, nullable: true }
        currentGrade: { type: string, nullable: true }
    Assignment:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        courseId: { type: string }
        canvasId: { type: string }
        title: { type: string }
        dueAt: { type: string, format: date-time, nullable: true }
        pointsPossible: { type: number, nullable: true }
        submitted: { type: boolean }
        graded: { type: boolean }
        status:
          type: string
          enum: [pending, planned, done, dismissed]
          description: >
            The planner workflow. "dismissed" means "I am not doing this" — it
            removes the item from counts and plans. To keep the item but stop
            being reminded about it, use remindersOff instead.
        remindersOff:
          type: boolean
          description: >
            Silences the deadline ladder for this one item without changing what
            it is. STRATEGY §1.3: the fact track can only be turned off one item
            at a time; the global deadlineAlerts toggle is deliberately blunt and
            this is what means a user does not have to reach for it.
            The ladder itself is 24h → 12h → 1h → overdue, one message per rung
            per item, ever — which is why the fact track needs no daily budget and
            does not consume the ≤3/day suggestion budget.
    OperationLog:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        actor: { type: string, enum: [user, agent, system] }
        action: { type: string, example: "plan_update" }
        domain:
          type: string
          enum: [schedule, habit, archive, care, system]
          description: >-
            Which part of the user's life the operation touched. Two consumers:
            the river colours its bands by domain, and rapport (how much latitude
            the user has given the agent) is scored per domain — being trusted
            with the schedule says nothing about being trusted to archive things.
            Only the first four are scored; system is plumbing. Derived from the
            action prefix when a row does not carry one.
        targetId: { type: string }
        date: { type: string }
        summary: { type: string, description: "Short list-view line, clamped to 512 runes." }
        detail: { type: string, description: "Full JSON payload including before/after snapshots — this is what revert replays. Unbounded." }
        status: { type: string, enum: [ok, failed] }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    AdminStats:
      type: object
      properties:
        users: { type: integer }
        sessions: { type: integer }
        aiCalls: { type: integer }
        tokenUsed: { type: integer }
        feedbackUseful: { type: integer }
        feedbackTotal: { type: integer }
