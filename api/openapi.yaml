# ─── GENERATED FILE — do not edit ─────────────────────────────────────────────
# Assembled from api/spec/head.yaml + api/spec/paths/<tag>.yaml + api/spec/components.yaml
# by `make api-bundle`. Edit the shard for the tag you are changing; a path's
# shard is named after its tag, and the bundler enforces that. `go test ./...` fails
# when this file is stale, so a forgotten rebuild cannot reach CI green.

openapi: 3.1.0
info:
  title: Daycore v2 API
  version: "2.2.0"
  description: >
    Daycore v2 backend (Go). Autonomous AI day-planning + mood companion.
    Anonymous-first: POST /api/session/init issues an httpOnly, signed session
    cookie (dc_sid) that authorizes all data endpoints. Optional email/OAuth
    sign-in sets an httpOnly JWT cookie (dc_auth); logout revokes all issued JWTs
    (server-side token version). Same-origin web frontends MUST send cookies
    (fetch: credentials:"include"). Native apps and separately-deployed frontends
    use header credentials instead (dual-rail, cookies stay supported): the
    signed session token in X-Session-Token (returned by /api/session/init with
    {"tokenInBody":true}) and/or the JWT in Authorization: Bearer (returned by
    login/register with {"tokenInBody":true}). Check GET /api/version (apiVersion
    contract major) before use — matching rules in FRONTEND_HANDOFF.md.
    The browser extension authenticates to /api/import/* with X-Import-Token;
    admin endpoints use X-Admin-Token.
    Errors are {error, message}. The single SSE endpoint is /api/ai/companion —
    see FRONTEND_HANDOFF.md §B for the v2 frame protocol (NOT the legacy [DONE]).
servers:
  - url: http://localhost:8080
    description: Local (Go serves the API; nginx proxies /api in production)

tags:
  - { name: session }
  - { name: plan }
  - { name: proposals }
  - { name: rules }
  - { name: ai }
  - { name: chat }
  - { name: files }
  - { name: materials }
  - { name: wishes }
  - { name: inbox }
  - { name: memory }
  - { name: mood }
  - { name: themes }
  - { name: import }
  - { name: channels }
  - { name: ops }
  - { name: feedback }
  - { name: auth }
  - { name: admin }
  - { name: meta }

security:
  - sessionCookie: []
  - sessionToken: []
  - bearerAuth: []

paths:
  # ─── session ──────────────────────────────────────────────────────────────
  /api/session/init:
    post:
      operationId: sessionInit
      tags: [session]
      summary: Create/return the anonymous session; sets dc_sid cookie.
      description: >
        Optional body {"tokenInBody":true} adds "sessionToken" (the same signed
        value as the dc_sid cookie) to the response for clients without a cookie
        jar; send it back as the X-Session-Token header.
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { tokenInBody: { type: boolean } } } } } }
      responses: { '200': { description: "OK (Session; + sessionToken when tokenInBody)", content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } } }
  /api/session/theme:
    post:
      operationId: sessionTheme
      tags: [session]
      summary: Record the current theme.
      requestBody: { content: { application/json: { schema: { type: object, properties: { theme: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /api/session/settings:
    patch:
      operationId: sessionSettings
      tags: [session]
      summary: Update assistantName / theme / language / personaPrompt.
      description: >
        language is which of the user's two languages they are reading in right
        now — what the home-page switch flips. It must be one of their pair
        (GET /api/session/preferences); the pair itself is changed through
        PATCH /api/session/preferences, not here. A value outside the pair is
        rejected with 400 unsupported_locale. Reads never fail this way: a
        stored value that falls outside the pair resolves to the primary, so
        changing your pair never breaks your settings page.
      requestBody: { content: { application/json: { schema: { type: object, properties: { assistantName: { type: string }, currentTheme: { type: string }, language: { type: string, enum: [zh-CN, en-US] }, personaPrompt: { type: string, maxLength: 2000 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } } }
  /api/session/preferences:
    get:
      operationId: getPreferences
      tags: [session]
      summary: Get the proactive-feature toggles, timezone, category overrides and language pair.
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } } }
    patch:
      operationId: setPreferences
      tags: [session]
      summary: Partial update of toggles, timezone, category overrides and language pair.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
        '400': { description: "bad_timezone (not an IANA zone this build can load), bad_category, or unsupported_locale." }

  # ─── plan ─────────────────────────────────────────────────────────────────
  /api/plan:
    get:
      operationId: getPlan
      tags: [plan]
      summary: Single day with rule occurrences merged in (JSON null when empty).
      parameters: [{ name: date, in: query, required: true, schema: { type: string, example: "2026-07-13" } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/DayPlan' }, { type: 'null' } ] } } } } }
    post:
      operationId: upsertPlan
      tags: [plan]
      summary: Upsert a day's plan (full blocks). Use PATCH for single-block edits.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date], properties: { date: { type: string }, blocks: { type: array, items: { $ref: '#/components/schemas/TimeBlock' } }, note: { type: string }, sourceType: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DayPlan' } } } } }
    patch:
      operationId: patchPlan
      tags: [plan]
      summary: One incremental block action (add/update/remove); materializes rule blocks + tombstones.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date, action], properties: { date: { type: string }, action: { $ref: '#/components/schemas/PlanAction' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DayPlan' } } } }
        '409':
          description: The plan gate refused — the block is locked or has petrified.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanBlocked' } } }
  /api/plan/lock:
    post:
      operationId: lockPlanBlock
      tags: [plan]
      summary: Pin a block's time by hand, or let it go — the way out of a lock refusal.
      description: >-
        Sets lockLevel with lockSource=user, which is what stops derivation from
        putting the old lock back on the next write. Unlocking clears the reason:
        "set by your class timetable" should not stay attached to something the
        timetable no longer governs. Resetting to "derived" is deliberately not
        offered — see docs/specs/plan-semantics.md.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [date, blockId, level], properties: {
          date: { type: string },
          blockId: { type: string },
          level: { type: string, enum: [none, soft, hard] },
          reason: { type: string, description: "Optional, ≤200 runes. Kept verbatim and never translated — they are the user's own words. Empty renders as the default reason for the level, in the reader's language." } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DayPlan' } } } }
        '404': { description: No such block on that day. }
        '409':
          description: The plan gate refused — the block has petrified, so its lock is history too.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanBlocked' } } }
  /api/plan/range:
    get:
      operationId: getPlanRange
      tags: [plan]
      summary: Batch fetch [from,to] with rule occurrences merged per date.
      parameters: [{ name: from, in: query, required: true, schema: { type: string } }, { name: to, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DayPlan' } } } } } }

  # ─── proposals ────────────────────────────────────────────────────────────
  /api/proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: What is waiting on the user — the card stack.
      description: >-
        Defaults to the stack: pending, already delivered, and not yet lapsed.
        That conjunction is the point — deliveredAt is a permanent stamp, so
        asking about it alone would return every card this session was ever shown.
        Pass all=1 for the console view of everything.
      parameters:
        - { name: all, in: query, schema: { type: string, enum: ["1"] }, description: Everything this session ever had, newest first. }
        - { name: level, in: query, schema: { type: string, enum: [L1, L2, L3] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { proposals: { type: array, items: { $ref: '#/components/schemas/Proposal' } } } } } } }
  /api/proposals/{id}/respond:
    post:
      operationId: respondProposal
      tags: [proposals]
      summary: Answer a card nobody is blocked on.
      description: >-
        Distinct from POST /api/decisions/{id}/respond, which unblocks an agent
        turn waiting right now. Both write the same row. An empty or "reject"
        choice rejects; anything else accepts and marks that row.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { choice: { type: string }, text: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '404': { description: No such card. }
        '409': { description: Already answered, or expired. }
  /api/plan/conflict:
    post:
      operationId: markPlanConflict
      tags: [proposals]
      summary: "\u6807\u8bb0\u51b2\u7a81 \u2014 the third way out of a lock refusal."
      description: >-
        For when neither taking leave nor unlocking is right: the class really is
        immovable AND something else really does need that time. Creates a
        decision card rather than resolving it, because the system does not know
        which of the two matters more. Refuses with 422 if nothing actually
        overlaps — a card claiming a conflict that is not there teaches the user
        to distrust the cards.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date, blockId], properties: { date: { type: string }, blockId: { type: string } } } } } }
      responses:
        '200': { description: The card that was created., content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '422': { description: Nothing else wants that time. }

  # ─── rules ────────────────────────────────────────────────────────────────
  /api/rules:
    get: { operationId: listRules, tags: [rules], summary: All rules (active + paused)., responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { rules: { type: array, items: { $ref: '#/components/schemas/ScheduleRule' } } } } } } } } }
    post:
      operationId: createRule
      tags: [rules]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuleInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRule' } } } }, '400': { $ref: '#/components/responses/Error' } }
  /api/rules/batch:
    post:
      operationId: batchCreateRules
      tags: [rules]
      summary: Create many rules (ICS/timetable confirmations).
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { rules: { type: array, items: { $ref: '#/components/schemas/RuleInput' } } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
  /api/rules/{id}:
    patch:
      operationId: patchRule
      tags: [rules]
      summary: Partial update (validated BEFORE persist so a bad update can't corrupt the row).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuleInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRule' } } } }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteRule
      tags: [rules]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }

  # ─── ai ───────────────────────────────────────────────────────────────────
  /api/ai/companion:
    post:
      operationId: companion
      tags: [ai]
      summary: Companion agent over SSE v2 (tool-calls frame protocol).
      description: >
        Returns text/event-stream. Each frame is `data: {json}\n\n` discriminated
        by `type`: delta | reasoning | tool_start | tool_result | decision_card |
        error | done. Comment heartbeats `: ping`. NO `[DONE]` sentinel. See
        FRONTEND_HANDOFF.md §B. With threadId the server loads AND persists thread
        history; client roles are whitelisted to user/assistant.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { message: { type: string, description: "May be empty when attachmentIds is not — dropping in a photo with no words is a complete thing to say." }, timezone: { type: string }, location: { type: string, maxLength: 128, description: "Where the device is, free text. Fills in or updates a device-detected location; never overwrites one the user set on the settings page. Used only by the briefs — the chat tool takes a location as an argument." }, assistantName: { type: string }, threadId: { type: string }, attachmentIds: { type: array, maxItems: 20, items: { type: string }, description: "Ids from POST /api/files. Must be this session's unsent uploads; they become part of the persisted user message. Files the chosen model cannot read are described to it by name rather than dropped." }, conversationHistory: { type: array, items: { type: object, properties: { role: { type: string, enum: [user, assistant] }, content: { type: string } } } } } } } } }
      responses: { '200': { description: SSE stream (text/event-stream), content: { text/event-stream: { schema: { type: string }, example: 'data: {"type":"delta","text":"好的"}\n\ndata: {"type":"done"}\n\n' } } } }
  /api/ai/companion/async:
    post:
      operationId: companionAsync
      tags: [ai]
      summary: Fire-and-forget companion turn (no client connection needed).
      description: >
        Persists the user message plus a pending assistant placeholder and
        returns 202 immediately; the agent runs server-side detached from the
        connection. Poll GET /api/chat/messages/{messageId} (or the thread's
        message list) until status leaves "pending". A decision_card frame may
        appear in the placeholder's toolEvents while still pending — answer it
        via POST /api/decisions/{id}/respond (wait budget 90s in async mode).
        threadId is REQUIRED. See FRONTEND_HANDOFF.md §H.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [threadId], properties: { message: { type: string, description: "May be empty when attachmentIds is not." }, threadId: { type: string }, timezone: { type: string }, location: { type: string, maxLength: 128 }, assistantName: { type: string }, attachmentIds: { type: array, maxItems: 20, items: { type: string } } } } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { threadId: { type: string }, userMessageId: { type: string }, messageId: { type: string }, status: { type: string, enum: [pending] } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/ai/auto-plan:
    post:
      operationId: autoPlan
      tags: [ai]
      summary: Autonomous multi-day planning from imported materials.
      requestBody: { content: { application/json: { schema: { type: object, properties: { from: { type: string }, to: { type: string }, mode: { type: string, enum: [keep_manual, replace_all] }, extra: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
  /api/ai/plan-text:
    post:
      operationId: planText
      tags: [ai]
      summary: Natural language → day plan JSON (candidates).
      requestBody: { content: { application/json: { schema: { type: object, properties: { text: { type: string }, date: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /api/ai/plan-image:
    post:
      operationId: planImage
      tags: [ai]
      summary: "Image → day plan (vision). imageBase64 has no data: prefix."
      requestBody: { content: { application/json: { schema: { type: object, properties: { imageBase64: { type: string }, date: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
  /api/ai/extract-schedule-image:
    post:
      operationId: extractScheduleImage
      tags: [ai]
      summary: Timetable screenshot → rule candidates.
      requestBody: { content: { application/json: { schema: { type: object, properties: { imageBase64: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
  /api/ai/travel:
    post:
      operationId: aiTravel
      tags: [ai]
      summary: Destination + dates → AI itinerary suggestion + inbox draft.
      description: >
        Returns {title, summary, itinerary{days[]}, tips[], draftId}. Confirming
        is the standard POST /api/inbox/commit with the draftId — it lands as a
        travel material (Body carries destination/dates/itinerary/tips JSON).
        Requires the travel category to be enabled. Rate-limited.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [destination], properties: { destination: { type: string }, startDate: { type: string }, endDate: { type: string }, notes: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' } }
  /api/ai/mood:
    post:
      operationId: aiMood
      tags: [ai]
      summary: Mood → AI response (memory facts injected).
      requestBody: { content: { application/json: { schema: { type: object, properties: { mood: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /api/ai/theme:
    post:
      operationId: aiTheme
      tags: [ai]
      summary: AI-generated theme palette (preview, not persisted).
      requestBody: { content: { application/json: { schema: { type: object, properties: { description: { type: string }, base: { type: string }, themeId: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /api/decisions/{id}/respond:
    post:
      operationId: respondDecision
      tags: [ai]
      summary: Resolve a pending decision card (unblocks the companion agent loop).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { choice: { type: string }, text: { type: string } } } } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }

  # ─── chat ─────────────────────────────────────────────────────────────────
  /api/chat/threads:
    get: { operationId: listThreads, tags: [chat], summary: List threads (first call auto-imports legacy companion_memory once)., responses: { '200': { description: OK } } }
    post:
      operationId: createThread
      tags: [chat]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChatThread' } } } } }
  /api/chat/threads/{id}:
    patch:
      operationId: updateThread
      tags: [chat]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string }, archived: { type: boolean } } } } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteThread
      tags: [chat]
      summary: Delete a thread and cascade its messages.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/chat/threads/{id}/messages:
    get:
      operationId: listMessages
      tags: [chat]
      summary: Cursor pagination (newest→oldest); before = oldest createdAt (UnixMilli) of the previous page.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: before, in: query, schema: { type: string, description: "UnixMilli; non-numeric → 400" } }, { name: limit, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } } } } } }, '400': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: clearMessages
      tags: [chat]
      summary: Clear all messages (keep the thread).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /api/chat/messages/{id}:
    get:
      operationId: getMessage
      tags: [chat]
      summary: One message by id — cheap polling target for async turns.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessage' } } } }, '404': { $ref: '#/components/responses/Error' } }
  /api/companion-history:
    get: { operationId: getCompanionHistory, tags: [chat], summary: Legacy companion memory blob (superseded by chat threads)., responses: { '200': { description: OK } } }
    post: { operationId: setCompanionHistory, tags: [chat], responses: { '200': { description: OK } } }

  # ─── files ────────────────────────────────────────────────────────────────
  /api/files:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload bytes and get an attachment id back.
      description: >-
        The body is the file's RAW BYTES with its type in Content-Type — not
        multipart and not base64 JSON. From a browser that is
        `fetch(url, {method:'POST', headers:{'Content-Type': file.type}, body: file})`.
        The response never contains a storage ref: the id is the only handle, and
        the server resolves it to bytes only for the session that uploaded them.
        An upload is unbound until it rides along with a chat message
        (POST /api/ai/companion with attachmentIds); unbound uploads are reclaimed
        after 24 hours. 503 when the deployment has no BLOB_STORE configured,
        which is a supported configuration rather than a fault.
      parameters:
        - { name: filename, in: query, schema: { type: string }, description: "Original name, shown to the user and echoed in Content-Disposition. Sanitised server-side." }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Stored., content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
        '400': { description: No Content-Type, or zero bytes. }
        '413': { description: Over MAX_UPLOAD_BYTES. }
        '503': { description: This deployment has no file bus. }
    get:
      operationId: listPendingFiles
      tags: [files]
      summary: Uploads not yet sent — what a composer restores after a reload.
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/Attachment' } } } } } } }
  /api/files/{id}:
    get:
      operationId: downloadFile
      tags: [files]
      summary: The bytes.
      description: >-
        Always proxied, never a redirect to a signed URL — a client that had to
        handle both shapes would only ever be tested against one. Served with
        nosniff and a sandbox CSP because these are user-supplied bytes on the
        app's own origin. ETag is the content SHA-256, so If-None-Match is exact.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: string, enum: ["1"] }, description: "Force Content-Disposition: attachment." }
      responses:
        '200': { description: OK, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '304': { description: Matched If-None-Match. }
        '404': { description: No such attachment in this session. }
        '410': { description: The row outlived its bytes. }
        '503': { description: This deployment has no file bus. }
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Drop an upload that was never sent.
      description: >-
        Only unbound uploads. Once an attachment belongs to a message the way to
        remove it is to remove the message — otherwise a message would render a
        file that is no longer there.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Deleted, row and bytes. }
        '404': { description: No such attachment in this session. }
        '409': { description: It belongs to a message now. }

  # ─── materials ────────────────────────────────────────────────────────────
  /api/materials:
    get:
      operationId: listMaterials
      tags: [materials]
      parameters: [{ name: category, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer } }, { name: offset, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK } }
    post:
      operationId: createMaterial
      tags: [materials]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } } }
  /api/materials/search:
    get:
      operationId: searchMaterials
      tags: [materials]
      summary: Full-text search — engine-native FTS with ranking, substring fallback as the recall floor.
      description: >
        Served by the storage engine's native index when available (SQLite FTS5
        trigram / PG tsvector / MySQL FULLTEXT ngram / Mongo text), with real
        relevance scores. Falls back transparently to the case-insensitive
        substring scan when the index is unavailable, the term is under 3
        characters (SQLite), or the engine can't tokenize the script (Mongo +
        CJK) — fallback results carry Score 1. Best-effort ranking; recall is
        guaranteed by the fallback.
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }, { name: category, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } } } } } } }, '501': { $ref: '#/components/responses/Error' } }
  /api/materials/categories:
    get:
      operationId: materialCategories
      tags: [materials]
      summary: The category registry with this session's enablement flags.
      description: >
        Full localized list {id, name, icon, enabled, default}. Frontends render
        the toggle panel from the full list and the capture UI from the enabled
        subset. Toggle via PATCH /api/session/preferences {materialCategories}.
        Writes to /api/materials validate category against the registry (empty →
        "note", unknown → 400 bad_category); reads never reject legacy free-text
        categories.
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { categories: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, icon: { type: string }, enabled: { type: boolean }, default: { type: boolean } } } } } } } } } }
  /api/materials/{id}:
    get: { operationId: getMaterial, tags: [materials], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      operationId: updateMaterial
      tags: [materials]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
    delete: { operationId: deleteMaterial, tags: [materials], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }

  # ─── wishes ───────────────────────────────────────────────────────────────
  /api/wishes:
    get:
      operationId: listWishes
      tags: [wishes]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [active, done, archived] } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { wishes: { type: array, items: { $ref: '#/components/schemas/Wish' } } } } } } } }
    post:
      operationId: createWish
      tags: [wishes]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string }, note: { type: string }, effortMin: { type: integer } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Wish' } } } } }
  /api/wishes/{id}:
    get: { operationId: getWish, tags: [wishes], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Wish' } } } }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      operationId: updateWish
      tags: [wishes]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string }, note: { type: string }, effortMin: { type: integer }, status: { type: string, enum: [active, done, archived] } } } } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
    delete: { operationId: deleteWish, tags: [wishes], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }

  # ─── inbox ────────────────────────────────────────────────────────────────
  /api/inbox/process:
    post:
      operationId: inboxProcess
      tags: [inbox]
      summary: "Classify a quick capture ({text} or {temp_id}) via AI → confirmation card + draftId."
      description: >
        AI classification over the session's ENABLED categories (see
        /api/materials/categories). Response always carries the legacy keys
        {understanding, suggestions}; when the AI is confident (≥0.5) it adds
        "classification" ({category, confidence, title, summary, structured,
        suggested_action, advice?}) and "draftId" — show the card, let the user
        confirm/override, then POST /api/inbox/commit. On AI failure or low
        confidence it falls back to the keyword categorizer (no draftId).
        Rate-limited like other AI endpoints.
      requestBody: { content: { application/json: { schema: { type: object, properties: { text: { type: string }, temp_id: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /api/inbox/commit:
    post:
      operationId: inboxCommit
      tags: [inbox]
      summary: Execute a confirmed classification draft (server-side mapping to the target module).
      description: >
        Looks up the server-side draft (1h TTL), applies optional overrides,
        validates the category against the session's enabled set, and lands the
        capture as a typed Material (Body = {"text", "structured"?, "advice"?}
        JSON, Source "inbox"). Preferred over hand-rolling module calls — the
        classification→module mapping lives once, server-side.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [draftId], properties: { draftId: { type: string }, overrides: { type: object, properties: { category: { type: string }, title: { type: string }, summary: { type: string }, body: { type: string } } }, alsoKeepNote: { type: boolean, description: "when the draft routes to an assignment, also keep the raw capture as a material" } } } } } }
      responses: { '200': { description: "OK {type: material|assignment, material?, assignment?} — academic drafts with a due date become manual assignments" }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/inbox/upload:
    post:
      operationId: inboxUpload
      tags: [inbox]
      summary: Upload a file (≤8MB); small files (≤1MB) persist for /process to consume. Requires session + rate-limited.
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { temp_id: { type: string }, filename: { type: string }, size: { type: integer }, content_type: { type: string }, stored: { type: boolean } } } } } } }
  /api/temp-context:
    get:
      operationId: getTempContext
      tags: [inbox]
      summary: "Get a session-scoped value (missing/expired → {data:null})."
      parameters: [{ name: key, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: string, nullable: true }, ttl: { type: string } } } } } } }
    put:
      operationId: putTempContext
      tags: [inbox]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key], properties: { key: { type: string }, payload: { type: string }, ttlSeconds: { type: integer } } } } } }
      responses: { '200': { description: OK } }

  # ─── memory ───────────────────────────────────────────────────────────────
  /api/memory:
    get: { operationId: listMemory, tags: [memory], responses: { '200': { description: OK } } }
    post:
      operationId: addMemory
      tags: [memory]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fact], properties: { fact: { type: string, maxLength: 500 }, source: { type: string, enum: [chat, user, import] } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
    delete: { operationId: clearMemory, tags: [memory], summary: Forget everything (privacy)., responses: { '200': { description: OK } } }
  /api/memory/{id}:
    delete: { operationId: deleteMemory, tags: [memory], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }

  # ─── mood ─────────────────────────────────────────────────────────────────
  /api/mood/kinds:
    get:
      operationId: listMoodKinds
      tags: [mood]
      summary: The mood registry, localized. Frontends render from this.
      description: >
        The vocabulary of moods this installation knows, with the label already
        resolved for the caller's language (Accept-Language, or the session's
        pair). A frontend MUST render from this rather than keeping its own list:
        the id is what gets stored, and a client that invents its own ids writes
        check-ins the mood window silently discards.


        Valence is deliberately not exposed. It is a coarse internal number used to
        read a trend, never a score to show anyone.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: happy }
                        emoji: { type: string, example: "😊" }
                        name: { type: string, example: 开心 }
  /api/mood:
    get:
      operationId: listMood
      tags: [mood]
      parameters: [{ name: limit, in: query, schema: { type: integer } }]
      description: >
        Rows carry source (user | agent, "" on rows written before the column
        existed and read as user) and note. Clients that want to know how
        someone has been doing should not average this list themselves — the
        server derives a mood window (trend, decayed score, staleness) and
        injects it into prompts; see docs/DATA.md.
      responses: { '200': { description: OK } }
    post:
      operationId: createMood
      tags: [mood]
      description: >
        source is NOT accepted from the body — a check-in posted here is always
        recorded as source=user. The agent records its own (source=agent)
        through its tool, and those weigh less in the derived mood window, so
        letting a client pick would let it write check-ins the server quietly
        discounts. note is whatever the user chose to add; it is never asked
        for.


        mood is a registry id from GET /api/mood/kinds, never a display string.
        An unknown id is rejected with 400 unknown_mood rather than stored: a
        value the registry cannot resolve has no valence, and a check-in with no
        valence is not a weaker signal, it is no signal. (The shipped frontend
        used to send "😊 开心" here, which meant every check-in was invisible to
        the companion.)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mood], properties: { mood: { type: string }, aiResponse: { type: string }, exerciseOffered: { type: string }, theme: { type: string }, note: { type: string } } } } } }
      responses: { '200': { description: OK } }
    patch:
      operationId: patchMood
      tags: [mood]
      summary: Mark a check-in's exercise completed (session-scoped).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
      responses: { '200': { description: OK } }

  # ─── themes ───────────────────────────────────────────────────────────────
  /api/themes:
    get: { operationId: listThemes, tags: [themes], responses: { '200': { description: OK } } }
    post:
      operationId: createTheme
      tags: [themes]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomTheme' } } } }
      responses: { '200': { description: OK } }
  /api/themes/{id}:
    patch: { operationId: patchTheme, tags: [themes], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CustomTheme' } } } }, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    delete: { operationId: deleteTheme, tags: [themes], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }

  # ─── import ───────────────────────────────────────────────────────────────
  /api/import/token:
    get: { operationId: getImportToken, tags: [import], responses: { '200': { description: OK } } }
    post: { operationId: rotateImportToken, tags: [import], responses: { '200': { description: OK } } }
  /api/import/canvas:
    post:
      operationId: importCanvas
      tags: [import]
      security: [{ importToken: [] }, { sessionCookie: [] }]
      summary: Canvas direct push (extension) or JSON upload.
      responses: { '200': { description: OK } }
  /api/import/ics:
    post:
      operationId: importICS
      tags: [import]
      summary: ICS upload (preview → confirm via rules/batch).
      description: >-
        Accepts `text/calendar` (raw body, query params) or JSON.

        TWO TIMEZONES, and they answer different questions: the SESSION timezone is
        where the user is now; the CALENDAR timezone is whose wall clocks the
        file's times belong to. A "09:00" in a Shanghai timetable means 09:00
        中国时间 whatever city the student is sitting in, so floating times (no Z,
        no TZID) are interpreted in the calendar's zone — read from
        X-WR-TIMEZONE — and `timezone` is only the fallback for a file that does
        not say.

        When the file names a zone, that zone is not the session's, AND the file
        has floating times whose meaning therefore depends on the answer, the
        import stops with 409 `timezone_mismatch` and does nothing. Re-send with
        `tzConfirmed` (and `timezone` if the user chose the other one) to proceed.
        It never asks when the two agree or when every time carries its own anchor,
        and `preview` is never blocked — that is how a client shows the user what
        they are deciding about.

        An event's zone is editable afterwards through PATCH /api/rules/{id}
        `timezone`.
      parameters:
        - { name: preview, in: query, schema: { type: string, enum: ["1"] } }
        - { name: timezone, in: query, schema: { type: string }, description: "Fallback zone for floating times; overridden by X-WR-TIMEZONE unless tzConfirmed." }
        - { name: tzConfirmed, in: query, schema: { type: string, enum: ["1"] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                icsText: { type: string }
                preview: { type: boolean }
                timezone: { type: string }
                tzConfirmed: { type: boolean, description: "The user saw the mismatch; import with the zone given." }
          text/calendar:
            schema: { type: string }
      responses:
        '200': { description: OK }
        '400': { description: Not an iCalendar payload. }
        '409':
          description: >-
            timezone_mismatch — the calendar names a zone that is not the
            session's and has floating times. Nothing was imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [timezone_mismatch] }
                  message: { type: string }
                  calendarTimezone: { type: string }
                  sessionTimezone: { type: string }
                  events: { type: integer }
  /api/import/history:
    get: { operationId: importHistory, tags: [import], responses: { '200': { description: OK } } }
  /api/courses:
    get: { operationId: listCourses, tags: [import], responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Course' } } } } } } }
  /api/assignments:
    get: { operationId: listAssignments, tags: [import], responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } } } }
    post:
      operationId: createAssignment
      tags: [import]
      summary: Manually add a deadline (quick-capture academic route).
      description: Source "manual"; Canvas re-imports never touch manual rows. dueAt accepts RFC3339, YYYY-MM-DDTHH:MM, or YYYY-MM-DD.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string }, dueAt: { type: string }, courseId: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }, '400': { $ref: '#/components/responses/Error' } }
  /api/assignments/{id}:
    patch:
      operationId: patchAssignment
      tags: [import]
      summary: Planner status and/or the per-item reminder switch.
      description: >-
        Two independent fields, and the distinction matters: status "dismissed"
        means "I am not doing this" and removes the item from counts and plans,
        while remindersOff keeps it and only silences the deadline ladder.
        At least one of the two must be present. STRATEGY §1.3 — the fact track can
        only be turned off one item at a time.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [pending, planned, done, dismissed] }, remindersOff: { type: boolean } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        '400': { description: Neither field was sent, or an unknown status. }
        '404': { description: No such assignment in this session. }

  # ─── channels ─────────────────────────────────────────────────────────────
  /api/channels:
    get: { operationId: listChannels, tags: [channels], summary: Available channels + binding status., responses: { '200': { description: OK } } }
  /api/channels/{channel}/bind:
    post:
      operationId: bindChannel
      tags: [channels]
      summary: Generate a 12-char token (10-min TTL) to send to the bot.
      parameters: [{ name: channel, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string }, channel: { type: string }, note: { type: string } } } } } } }
  /api/channels/{channel}/verify:
    post:
      operationId: verifyChannel
      tags: [channels]
      summary: Verify token + externalId (unauthenticated, rate-limited, TTL-enforced).
      parameters: [{ name: channel, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, externalId], properties: { token: { type: string }, externalId: { type: string } } } } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' } }
  /api/channels/{channel}/unbind:
    delete: { operationId: unbindChannel, tags: [channels], parameters: [{ name: channel, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }

  # ─── ops ──────────────────────────────────────────────────────────────────
  /api/ops:
    get:
      operationId: listOps
      tags: [ops]
      parameters: [{ name: limit, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ops: { type: array, items: { $ref: '#/components/schemas/OperationLog' } } } } } } } }
  /api/ops/{id}/revert:
    post:
      operationId: revertOp
      tags: [ops]
      summary: Undo one logged operation (a revert cannot itself be reverted).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }

  # ─── feedback ─────────────────────────────────────────────────────────────
  /api/feedback:
    post:
      operationId: addFeedback
      tags: [feedback]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { messageId: { type: string }, useful: { type: boolean }, reason: { type: string } } } } } }
      responses: { '200': { description: OK } }

  # ─── auth ─────────────────────────────────────────────────────────────────
  /api/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Email + password sign-up (rate-limited).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string, minLength: 8 }, name: { type: string }, tokenInBody: { type: boolean, description: "true → response includes the JWT as \"token\" (native clients)" } } } } } }
      responses: { '200': { description: "OK {ok, user; + token when tokenInBody}" }, '409': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Email + password sign-in; merges anonymous data into the canonical session.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string }, tokenInBody: { type: boolean, description: "true → response includes the JWT as \"token\" (native clients)" } } } } } }
      responses: { '200': { description: "OK {ok, user; + token when tokenInBody}" }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /api/auth/logout:
    post: { operationId: logout, tags: [auth], summary: Clear the auth cookie and revoke all issued JWTs., responses: { '200': { description: OK } } }
  /api/auth/providers:
    get: { operationId: oauthProviders, tags: [auth], summary: List enabled OAuth providers., responses: { '200': { description: OK } } }
  /api/auth/oauth/{provider}:
    get:
      operationId: oauthStart
      tags: [auth]
      summary: Begin the OAuth authorization-code flow (redirects).
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses: { '302': { description: Redirect to provider } }
  /api/auth/oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      tags: [auth]
      summary: OAuth callback; links only verified emails, sets dc_auth, redirects to /.
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }, { name: code, in: query, schema: { type: string } }, { name: state, in: query, schema: { type: string } }]
      responses: { '302': { description: Redirect to / } }
  /api/me:
    get: { operationId: me, tags: [auth], summary: "Current user, or {user:null} when anonymous.", responses: { '200': { description: OK } } }

  # ─── admin ────────────────────────────────────────────────────────────────
  /api/admin/config:
    get:
      operationId: adminConfigGet
      tags: [admin]
      summary: Every configuration knob, both layers, with where its value came from.
      description: >-
        Two layers, and the console may only write one. BOOT settings built
        something at startup — a socket, a database handle, a signing key — so a
        new value cannot change the thing already built; they are shown read-only.
        RUNTIME settings are read fresh at each use, so an override takes effect on
        the next read.

        `source` says whether the active value came from the environment seed or
        from a stored override, which is what makes a meaningful reset control
        possible.

        `requiresRestart` marks a knob that is runtime BY NATURE but whose value
        was copied into something at construction (the rate limiters, the model
        catalog, the weather chain). Storing the override is accepted and correct;
        it simply will not take effect until a restart, and the console should say
        so rather than imply the change is live.

        SECRETS ARE NEVER RETURNED — not the value, not a prefix, not a length. A
        masked secret still leaks how long it is and whether it changed between two
        reads. `set` says whether it is configured, which is all the console needs.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items:
                      type: object
                      properties:
                        env: { type: string, description: The environment variable name. }
                        key: { type: string, description: "The Config field — this is what PUT takes." }
                        layer: { type: string, enum: [boot, runtime] }
                        value: { type: string, description: Absent for secrets. }
                        set: { type: boolean, description: "Configured at all; the only answer given for a secret." }
                        secret: { type: boolean }
                        source: { type: string, enum: [env, override] }
                        editable: { type: boolean, description: "layer==runtime and not a secret." }
                        why: { type: string, description: Why a surprising classification is what it is. }
                        requiresRestart: { type: boolean }
        '401': { description: No admin credential. }
    put:
      operationId: adminConfigPut
      tags: [admin]
      summary: Set or reset runtime overrides.
      description: >-
        `{"settings": {"MaxUploadBytes": "8388608", "AgentMaxRounds": null}}` —
        a string sets the override, NULL resets the key to its environment seed.
        Those are deliberately different from `""`: for a string knob "back to the
        default" and "set it to nothing" are different requests, and a console with
        only one of them cannot undo a mistake.

        The whole request is validated before any of it is written. A partial apply
        would leave the operator with some edits in place and no way to tell which,
        and there is no transaction to offer them.

        Boot-layer and secret keys are refused with a reason rather than stored —
        a row the console displays and the process ignores is the worst outcome
        available here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  requiresRestart:
                    type: array
                    items: { type: string }
                    description: "Keys whose new value waits for a restart. Per key, not one boolean — the operator's next question is WHICH one."
        '400': { description: "unknown_setting, not_editable, or bad_value." }
        '401': { description: No admin credential. }
        '503': { description: "degraded — storage is unavailable, so overrides cannot be written. The environment layer still applies." }
  /api/admin/session:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Obtain a short-lived console cookie, from the admin token or from your own login.
      description: >-
        TWO WAYS TO LOG IN, and only one of them is a password. Send
        `{"token": "<ADMIN_TOKEN>"}` for the root credential, which passes
        everything. Send `{}` while already signed in (dc_auth or a Bearer token)
        to exchange your OWN login for a console session whose permissions come
        from your roles — an ordinary user with no permissions is refused rather
        than handed a credential that can do nothing.

        It is an EXCHANGE, not an acceptance: dc_auth is long-lived and Path=/, so
        letting it authenticate /api/admin/* directly would give up SameSite=Strict,
        the narrow cookie path and the short TTL all at once.

        TWO WAYS INTO THE ADMIN API, for two callers. Machines (curl, CI, deploy
        scripts) keep sending `X-Admin-Token` on every request — that path is
        unchanged and was never the problem: the token is in a header rather than
        a URL and the comparison is constant-time.

        Humans use this endpoint once and get `dc_admin`: httpOnly (an XSS on the
        console cannot read it), Secure, SameSite=Strict, and short-lived. What it
        fixes is that the console used to keep the raw token in sessionStorage,
        where any XSS could read a credential that never expired and could only be
        rotated by redeploying.

        The cookie carries NO revocation mechanism — there is no admin account to
        bump a token version on, and the console must keep working when storage is
        down — so its TTL is its revocation. Logging out clears the cookie;
        a copy taken beforehand stays valid until it expires.

        CSRF: SameSite=Strict plus an Origin check, because a cookie rides along on
        cross-site requests and httpOnly buys confidentiality rather than
        authority. The header path needs neither — a custom header forces a
        preflight.

        ⚠️ An unset ADMIN_TOKEN no longer means "open outside production". The
        server generates one at startup and prints it; there is no unauthenticated
        state to fall into.
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { token: { type: string, description: 'ADMIN_TOKEN. Omit to exchange your own login instead.' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPrincipal' } } } }
        '401': { description: Wrong token, or no login to exchange. }
        '403': { description: Cross-origin request, or a signed-in account with no console permission. }
        '429': { description: Rate limited (shares the auth limiter). }
    get:
      operationId: adminWhoAmI
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Who am I, and what may I do.
      description: >-
        The console's first call after a reload. Needs a credential but no
        permission: the answer is the caller's own permission list, which tells
        them nothing clicking around would not.

        ⚠️ The console uses this to hide sections it cannot open. Hiding is a
        courtesy — every endpoint checks for itself, and a client that lies to
        itself about what it holds gets 403s, not access.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPrincipal' } } } }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminLogout
      tags: [admin]
      summary: Clear the console cookie.
      description: Deliberately open — a logout that 401s leaves somebody unable to clear a session they cannot use.
      responses:
        '200': { description: OK }
  /api/admin/prompts:
    get: { operationId: adminListPrompts, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Error' } } }
  /api/admin/prompts/{key}:
    get:
      operationId: adminGetPrompt
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }, { name: locale, in: query, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
    put:
      operationId: adminSetPrompt
      tags: [admin]
      security: [{ adminToken: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }, { name: locale, in: query, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
  /api/admin/stats:
    get: { operationId: adminStats, tags: [admin], security: [{ adminToken: [] }], summary: Dashboard aggregation (incl. feedbackUseful/feedbackTotal)., responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStats' } } } } } }
  /api/admin/ailogs:
    get:
      operationId: adminAILogs
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: The AI call ledger, newest first.
      description: >-
        One row per model call: endpoint, model, token counts, duration, status.

        ⚠️ NO REQUEST OR RESPONSE BODIES, and that is a boundary rather than a gap.
        The request body of a companion call IS the user's conversation, and
        ailogs.read promises the opposite ("今天不含对话正文"). If a capture is ever
        added it belongs behind db.user_content or a permission of its own, never
        behind this one.

        Paging is KEYSET, not offset: send `beforeAt` and `beforeId` from the
        previous page's last row (the response hands them back as `nextBeforeAt` /
        `nextBeforeId`). Both halves are required together — half a cursor pages
        from an instant with no tie-break, which is what the id exists to prevent.
        Offset paging over a table that grows at the head repeats and skips rows,
        which on a ledger reads as the log lying.

        ⚠️ The ledger is PRUNED (see `retentionDays` in the response). Asking for a
        window older than that returns nothing because the rows are gone, not
        because nothing happened.
      parameters:
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: endpoint, in: query, schema: { type: string }, description: One of the values in the response's `endpoints`. }
        - { name: model, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ok, error] } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: RFC3339 lower bound, inclusive. }
        - { name: beforeAt, in: query, schema: { type: string }, description: 'Cursor half; requires beforeId.' }
        - { name: beforeId, in: query, schema: { type: string }, description: 'Cursor half; requires beforeAt.' }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs: { type: array, items: { $ref: '#/components/schemas/AICallLog' } }
                  endpoints: { type: array, items: { type: string }, description: This build's endpoint vocabulary, for the filter. }
                  retentionDays: { type: integer }
                  nextBeforeAt: { type: string, description: Absent when this page did not fill. }
                  nextBeforeId: { type: string }
        '400': { description: Bad status, since, or half a cursor. }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/users:
    get: { operationId: adminUsers, tags: [admin], security: [{ adminToken: [] }], responses: { '200': { description: OK } } }
  /api/admin/users/{id}:
    delete: { operationId: adminDeleteUser, tags: [admin], security: [{ adminToken: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
  /api/admin/permissions:
    get:
      operationId: adminPermissions
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Every permission this build defines, with the sentence to grant from.
      description: >-
        Each entry carries a `damage` line saying what somebody holding it can do,
        in terms of CONSEQUENCE rather than endpoints — the person granting is
        deciding what somebody else can break, usually quickly, so "manage config"
        is not something a decision can be made from.

        Requires users.read rather than roles.edit: somebody who can see that a
        person is in the "support" group needs to be able to see what "support"
        means, or the user list is a screen of names that mean nothing.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { permissions: { type: array, items: { type: object, properties: { id: { type: string }, damage: { type: string } } } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/roles:
    get:
      operationId: adminRoles
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Every group, what it grants, and who is in it.
      description: >-
        Members come back with the list rather than behind a second call, because
        the question a role list is read to answer is "who can do this" — and a
        screen needing N+1 requests to answer it will be built to not answer it.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { roles: { type: array, items: { $ref: '#/components/schemas/AdminRole' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '503': { description: 'Degraded: no database, so groups cannot be read.' }
  /api/admin/roles/{name}:
    put:
      operationId: adminSetRole
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Create or replace what a group grants. Requires roles.edit.
      description: >-
        ⚠️ REPLACE, not merge — the body IS the new permission set. A merge
        endpoint cannot express "take this away", and the console's editor is a
        set of switches whose whole content is already the answer.

        ⚠️ roles.edit is OWNER-EQUIVALENT. Whoever can edit a group's permissions
        can put themselves in an all-powerful one. That is true of every RBAC and
        is not a flaw here, but granting it is the same decision as making somebody
        an owner. It is deliberately a different permission from users.assign for
        exactly that reason: holding both is holding everything.

        An unknown permission id is refused rather than stored — a stored id that
        nothing matches is a group that grants LESS than its own definition says,
        and the definition is what the person granting it reads.
      parameters: [{ name: name, in: path, required: true, schema: { type: string, maxLength: 64 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { description: { type: string }, permissions: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: OK }
        '400': { description: Empty or over-long name, or an unknown permission id. }
        '403': { $ref: '#/components/responses/Error' }
        '503': { description: 'Degraded: no database.' }
    delete:
      operationId: adminDeleteRole
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Remove a group and everybody's membership in it. Requires roles.edit.
      description: >-
        Both, in one call. Orphaned membership rows grant nothing until somebody
        recreates a group with the same name — at which point a set of people
        silently regain a permission set that was deleted.
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
        '503': { description: 'Degraded: no database.' }
  /api/admin/users/{id}/roles:
    put:
      operationId: adminSetUserRoles
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Set which groups one person is in. Requires users.assign.
      description: >-
        The commercial operation — moving a customer between tiers — and
        deliberately reachable without any power to change what those tiers mean.

        ⚠️ ADDITIONALLY requires roles.edit when any group being JOINED OR LEFT
        carries a permission, evaluated against the group as it is at that moment.
        Without that, "assign only" would quietly become "grant anything that
        already exists". The check is on the DIFFERENCE, so leaving somebody in a
        group they are already in never needs the higher permission.

        The whole set is sent, for the same reason the role editor replaces: an
        add/remove pair invites two requests that can half-apply.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: OK }
        '403': { description: Missing users.assign, or an admin group without roles.edit. }
        '404': { description: No such user, or no such group. }
        '503': { description: 'Degraded: no database.' }
  /api/admin/users/{id}/owner:
    put:
      operationId: adminSetOwner
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Mark or unmark a super-administrator. ROOT CREDENTIAL ONLY.
      description: >-
        Not owner-only, not roles.edit — the ADMIN_TOKEN in the environment and
        nothing else. Three reasons, and the third is the one that matters:

        (1) The first administrator has to come from somewhere, and
        "whoever registers first" is a race with the internet on a fresh
        deployment. So the bootstrap is: the operator, holding the token they
        configured, marks a person.

        (2) It is the recovery path. Every other route can be locked out — the last
        owner deleted, the role rows wrong. This one is reachable as long as the
        process has its environment.

        (3) It cannot be delegated by accident. An owner can still hand out
        roles.edit, which is owner-equivalent in effect; what they cannot do is
        create another break-glass holder.

        ⚠️ There is deliberately no "cannot remove the last owner" rule — break-
        glass grants and revokes, and the root credential can undo it in one
        request. A missing `owner` field is a 400 rather than read as false.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [owner], properties: { owner: { type: boolean } } } } } }
      responses:
        '200': { description: OK }
        '400': { description: The owner field was missing. }
        '403': { description: Not the root credential. }
        '404': { description: No such user. }
        '503': { description: 'Degraded: no database.' }
  /api/admin/db/tables:
    get:
      operationId: adminDBTables
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Every catalogued table, its class, and its row count.
      description: >-
        Driven by a written-down catalogue (internal/domain/tables.go), not by
        runtime introspection. Two reasons: four engines answer "what tables do you
        have" four slightly different ways, and none of those answers carries the
        two facts that matter — whether the rows are somebody's diary, and which
        column must never leave the process.

        A table the caller cannot READ is still listed, with its row count, because
        "how big is chat_messages" is an operational fact; hiding a table's
        existence from somebody who can see every other one just looks broken.
        `rows: -1` means the count itself failed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables: { type: array, items: { $ref: '#/components/schemas/AdminDBTable' } }
        '403': { $ref: '#/components/responses/Error' }
        '503': { description: 'Degraded: no database.' }
  /api/admin/db/table/{name}:
    get:
      operationId: adminDBBrowse
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: One page of one table, newest first.
      description: >-
        ⚠️ The route declares db.operational, which is the WEAKER of the two browse
        permissions. The handler raises it per table from the catalogue's class —
        the pattern cannot tell operation_logs from chat_messages. This is the only
        place in the API where a handler tightens what the route allowed.

        Redacted columns come back as a fixed marker rather than being dropped:
        `sessions.import_token` is a bearer credential and `credentials.password_hash`
        is a hash, and the operator still needs to see that the field exists. The
        `redacted` array names them.

        Boundary — NO filtering, sorting or search, deliberately. Each of those
        means a caller-supplied identifier or predicate reaching the query, and the
        catalogue exists so that never happens. Paging is offset here (not keyset,
        as on the ledger) because a browsed table is not being written to at the
        head and the operator wants "page 7 of 40".
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  table: { type: string }
                  class: { type: string, enum: [operational, user_content] }
                  columns: { type: array, items: { type: string } }
                  rows: { type: array, items: { type: array, items: {} } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  deletable: { type: boolean }
                  whyNot: { type: string }
                  redacted: { type: array, items: { type: string } }
        '403': { description: This table's class needs a permission the caller does not hold. }
        '404': { description: Not a catalogued table. }
        '503': { description: 'Degraded: no database.' }
  /api/admin/db/table/{name}/{id}:
    delete:
      operationId: adminDBDelete
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Delete one row. Needs db.delete_row AND the table's class permission.
      description: >-
        ⚠️ Bypasses every business rule and writes NOTHING to the undo ledger.
        There is no compensation to record because the browser does not know what
        the row meant. It is logged at warn level in the process log, which is the
        only trace it leaves.

        Ten of the catalogued tables have composite keys and refuse with 409 rather
        than 404 — the row is still there, "delete row X" simply has no meaning.
        Two of those (roles, role_members) would additionally break an invariant a
        proper endpoint maintains, and say so in `message`.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: No such table, or no such row. }
        '409': { description: This table has no single-row key. }
        '503': { description: 'Degraded: no database.' }
  /api/admin/db/export:
    get:
      operationId: adminDBExport
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: The catalogue as JSON. A snapshot, NOT a backup.
      description: >-
        ⚠️ Exports the OPERATIONAL half and SKIPS the user-content half unless the
        caller also holds db.user_content — the skipped names come back in
        `skippedUserTables`. Anything else would make db.export a way around the
        split: one click and somebody with only db.operational has every
        conversation in the deployment on a disk. Redacted columns stay redacted.

        ⚠️ NOT a consistent backup. There are no transactions anywhere in the
        storage layer, so tables are read one after another and a write landing
        between two of them appears in one and not the other. The note travels
        inside the file, because the file outlives the screen that produced it.
        For a real backup use the engine's own tool.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: { type: string, format: date-time }
                  version: { type: string }
                  note: { type: string }
                  skippedUserTables: { type: array, items: { type: string } }
                  tables: { type: object, additionalProperties: { type: array, items: { type: object } } }
        '403': { $ref: '#/components/responses/Error' }
        '503': { description: 'Degraded: no database.' }
  /api/admin/db/import:
    post:
      operationId: adminDBImport
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Always 501, with the reason and the alternative.
      description: >-
        ⚠️ NOT a stub awaiting an implementation. It used to answer 200 `{"ok":true}`
        while doing nothing, so somebody restoring a deployment got a success
        message and an empty database.

        Refused because importing means overwriting tables a live process is
        reading and writing, and there are no transactions in this storage layer —
        a half-applied import leaves a database that is neither the old data nor
        the new. The honest path is a fresh deployment via `daycore install`.
      responses:
        '501': { description: Import is not available; the message says what to do instead. }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/db/backup:
    get:
      operationId: adminDBBackup
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Always 501, naming the right tool per engine.
      description: >-
        No database file download on any engine, including SQLite. Copying a live
        SQLite file byte-for-byte while a write is in flight produces a corrupt
        file with the difference sitting in the WAL beside it — `sqlite3 .backup`
        exists because that is a real problem. Rather than four half-answers, one
        honest one: sqlite3 .backup / pg_dump / mysqldump / mongodump.
      responses:
        '501': { description: Not available; the message names the tool to use. }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/providers:
    get:
      operationId: adminProvidersGet
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: External capability sources, with health
      description: >
        Every configured weather / search source, including disabled and unhealthy
        ones — those are usually the ones being asked about.


        Only three fields are writable (enabled, description, approved);
        `editable` lists them. Identity and wiring — id, format, base_url,
        token_env — live in config/providers.yaml and are file-only. That is F1's
        rule applied per field: the process built an HTTP client out of base_url at
        startup, so a new value cannot change the thing already built. base_url has
        a second reason — it is the SSRF entrance, and requiring shell access to
        change it is the whole defence.


        `health` is PER PROCESS by design and never persisted: an adapter is often
        same-host, so what one instance cannot reach another may reach fine. Two
        consoles legitimately disagree, which is why `instance` names which one
        answered.


        No secret appears. `tokenEnv` is the variable NAME and `tokenSet` says
        whether it currently holds anything — never the value, a prefix, or a
        length.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/ProviderView' } }
                  configPath: { type: string, description: The file to edit for the fields this screen cannot touch. }
                  instance: { type: string }
        '401': { description: No admin credential. }
    put:
      operationId: adminProvidersPut
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Set enabled / description / approved on one or more sources
      description: >
        A sparse patch: a field the console does not send keeps what it had. The
        whole request is validated before any of it is written, because there is no
        transaction and a partial apply leaves the operator with some edits in
        place and no way to tell which.


        `approved` means "an operator has read this text", and it is recorded
        against a HASH of the description being approved — so editing the
        description revokes its approval automatically. Without that the gate would
        be one edit away from decorative and nothing anywhere would go red. An
        unapproved source still works; the model is told about it in a sentence the
        backend builds from its id and format rather than in the operator's words.


        An adapter's own self-reported description is NEVER injected and the server
        has no path that promotes it into this field. It appears separately as
        `manifestDescription` so an operator can read it and choose to adopt it,
        which records an approval like any other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providers]
              properties:
                providers:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [kind, id]
                    properties:
                      kind: { type: string, enum: [weather, search, channel] }
                      id: { type: string }
                      enabled: { type: boolean }
                      description:
                        type: object
                        additionalProperties: { type: string }
                        description: Per locale. Both zh-CN and en-US are required — one language only vanishes for half the users.
                      approved: { type: boolean }
      responses:
        '200':
          description: OK, with the refreshed list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  providers: { type: array, items: { $ref: '#/components/schemas/ProviderView' } }
        '400': { description: Unknown source, or a description that is not in both locales. }
        '401': { description: No admin credential. }
        '503': { description: Degraded — the override table is in the database. }
  /api/admin/models:
    get:
      operationId: adminModelsGet
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: The model catalog as it is actually loaded
      description: >
        Read-only, and that is a decision rather than an omission. Every field
        here is boot-layer: an entry became a constructed provider with its base
        URL and key baked in, so a new value cannot change the thing already
        built. Which model fills which role IS editable — through
        `PUT /api/admin/config` (DEFAULT_CHAT_MODEL and friends); a second door to
        the same setting would be a second door that can disagree.


        Disabling an entry was considered and not built: it is the one write that
        can take a deployment down from a web page with no obvious way back — turn
        off the entry DEFAULT_CHAT_MODEL points at and every AI feature fails, on
        a screen whose next likely action is to turn off another one. The recovery
        that already exists is better, and leaves the broken entry visible rather
        than hidden.


        Served from the loaded catalog, not by re-reading models.yaml: a screen
        built from the file would describe a file that may have changed since
        boot, i.e. a process that does not exist.


        No key appears. `apiKeyEnv` is the variable NAME and `keySet` says whether
        a key was resolved at all.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  models: { type: array, items: { $ref: '#/components/schemas/ModelDetail' } }
                  configPath: { type: string, description: The file to edit, since nothing here is writable. }
        '401': { description: No admin credential. }
  /api/admin/models/{id}/test:
    post:
      operationId: adminModelTest
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Actually call the model once
      description: >
        "Is the key set" and "is the key VALID" are different questions and only
        the second matters. Nothing about a correct-looking configuration reveals
        a revoked key, a moved gateway or an exhausted account — and without this,
        the only way to find out is to use the app and watch a feature fail, which
        reports the failure to a user instead of an operator.


        One tiny call with max_tokens 1, and the reply is discarded. A console
        that could send arbitrary prompts on the deployment's key would be a way
        to spend somebody's money from a web page.


        ⚠️ A failed call answers **200 with ok:false**, not an error status: the
        request to this server succeeded and found something out. A 502 would make
        the console show "the admin API is broken" over what is, in fact, the
        answer.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The result of the attempt, successful or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  model: { type: string }
                  elapsedMs: { type: integer }
                  message: { type: string }
        '400': { description: No such model in the catalog. }
        '401': { description: No admin credential. }
  /api/admin/oauth:
    get:
      operationId: adminOAuthGet
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Configured social logins, with the callback URL to register
      description: >
        Read-only for the same reason as the models screen: credentials live in
        config/oauth.yaml and the flow was constructed from them at startup.


        `redirectUri` is the point of this screen. A mismatch there is the most
        common OAuth setup failure, the vendor's error says nothing useful, and
        the value is derived from PUBLIC_BASE_URL — which an operator cannot see
        from a browser. It is produced by the same function the login flow uses,
        so it cannot drift into being merely plausible.


        `clientId` appears because it is not a secret: it travels in the authorize
        URL of every login. `clientSecret` never appears in any form.


        ⚠️ Providers with an empty client_id are skipped at startup and are
        genuinely absent here — the manager has no memory of them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/OAuthProviderView' } }
                  configPath: { type: string }
                  note: { type: string }
        '401': { description: No admin credential. }
  /admin:
    get:
      operationId: consoleIndex
      tags: [admin]
      summary: The operations console (static, unauthenticated)
      description: >
        Not an API endpoint — it serves the console's static bundle, embedded in
        the binary. It appears in this contract because everything this deployment
        answers appears in this contract, and because "does this build carry a
        console" is a real question with a real answer.


        **Deliberately unauthenticated.** Static files are not secret; every byte
        is in the public repository, and gating the HTML would only produce a
        login page that cannot render its own login form. The credential check is
        on `/api/admin/*`, where the data is.


        ⚠️ The consequence, and it is a real constraint on the console: nothing in
        that bundle may carry a secret, a deployment-specific value, or anything
        the API would refuse to serve unauthenticated.


        404 with an explanation when this build carries no console (`-tags lite`,
        or a clone where web/console was never built).
      responses:
        '200': { description: The console HTML. }
        '404': { description: This build carries no console. }
  /admin/:
    get:
      operationId: consoleAsset
      tags: [admin]
      summary: Console assets and client-side routes
      description: >
        Real files are served as themselves; anything else falls through to
        index.html, because an unknown path under /admin is a client-side route
        rather than a missing file.
      responses:
        '200': { description: An asset, or index.html for a client-side route. }
        '404': { description: This build carries no console. }
  /api/admin/health:
    get:
      operationId: adminHealth
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: What the overview screen needs, in one call
      description: >
        `/api/healthz` is unauthenticated and therefore cannot say anything
        useful: it reports that storage is unavailable and deliberately refuses to
        say why, because a driver error routinely carries the DSN and a DSN
        routinely carries a password. Its own comment promised that "the operator
        gets the reason through the console" — and until this endpoint existed
        that was true of no code at all. `DegradedReason()` had exactly one
        caller: a log line in main.


        Three things live here and nowhere else:

        - `reason` — the actual driver error. The most useful string in a broken
          deployment, and the one thing the public endpoint must not say.

        - `uptimeSec` / `startedAt` — "did this just restart" is how an operator
          tells a configuration problem from a crash loop.

        - `instance` — health is per process by design, so two consoles behind a
          load balancer legitimately disagree. Without a name attached that is an
          unexplainable bug report rather than a fact.


        Three states, not two: degraded (storage never opened), running with an
        unreachable database (`dbReachable:false`), and healthy. The middle one is
        invisible to a boolean.


        ⚠️ Answers **200** in all three — the request to this server succeeded and
        found something out. A 503 here would make the console show "the admin API
        is broken" over what is, in fact, the answer.
      responses:
        '200':
          description: The state of this process
          content:
            application/json:
              schema:
                type: object
                properties:
                  degraded: { type: boolean, description: Storage never opened. One-way; the only exit is a restart. }
                  dbReachable: { type: boolean, description: Absent when degraded — there is no database to reach. }
                  reason: { type: string, description: The driver error. Present only when something is wrong. }
                  recovery: { type: string, description: Present when degraded, because there is no retry button and somebody will look for one. }
                  instance: { type: string }
                  startedAt: { type: string, format: date-time }
                  uptimeSec: { type: integer }
                  db: { type: string }
                  env: { type: string }
                  build: { type: string }
                  channel: { type: string }
                  console: { type: boolean, description: Whether this build carries the console bundle. }
        '401': { description: No admin credential. }

  # ─── meta ─────────────────────────────────────────────────────────────────
  /api/healthz:
    get:
      operationId: health
      tags: [meta]
      security: []
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, db: { type: string }, version: { type: string }, channel: { type: string }, env: { type: string } } } } } }, '503': { description: DB unavailable } }
  /api/models:
    get: { operationId: listModels, tags: [meta], security: [], responses: { '200': { description: OK } } }
  /api/version:
    get:
      operationId: apiVersion
      tags: [meta]
      security: []
      summary: API contract version (independent of the build version).
      description: >
        Clients call this before anything else. apiVersion is the contract major
        (breaking changes only); apiMinor bumps on additive changes; build is the
        server build ("2.2.0-beta"); minClient is the oldest compatible client
        build (advisory). Matching rules in FRONTEND_HANDOFF.md.


        locales.available lists every language this installation can render. It
        is NOT a compile-time list — only zh-CN and en-US are compiled in, and
        a <locale>.json message pack or a console override extends it — so
        clients must read it rather than hardcoding what they think exists.
        defaultPrimary/defaultSecondary are what a brand-new user starts with;
        a signed-in user's own pair comes from GET /api/session/preferences.

        features is capability discovery: what this deployment can do
        (vision / transcribe / tts / imagegen from the model catalog, files from
        whether a BLOB_STORE is configured), derived live. False means
        "not available here" — clients gate UI on it rather than assuming.
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { apiVersion: { type: integer }, apiMinor: { type: integer }, build: { type: string }, channel: { type: string }, minClient: { type: string }, features: { type: object, description: "Capability discovery, derived live from the model catalog; false = not available on this deployment.", properties: { vision: { type: boolean }, transcribe: { type: boolean }, tts: { type: boolean }, imagegen: { type: boolean }, files: { type: boolean, description: "POST /api/files works. False when no BLOB_STORE is configured — do not show an attach control." } } }, locales: { type: object, properties: { available: { type: array, items: { type: string }, example: ["en-US", "zh-CN"] }, defaultPrimary: { type: string, example: "zh-CN" }, defaultSecondary: { type: string, example: "en-US" } } } } } } } } }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: dc_sid }
    authCookie: { type: apiKey, in: cookie, name: dc_auth }
    sessionToken: { type: apiKey, in: header, name: X-Session-Token, description: "Same signed value as the dc_sid cookie, for clients without a cookie jar. Get it from POST /api/session/init {tokenInBody:true}." }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: "Same JWT as the dc_auth cookie. Get it from login/register {tokenInBody:true}; logout revokes all issued JWTs (token-version bump)." }
    importToken: { type: apiKey, in: header, name: X-Import-Token, description: "Session-scoped token for the browser extension's direct push." }
    adminToken: { type: apiKey, in: header, name: X-Admin-Token, description: "Admin endpoints." }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: "Stable code the frontend translates (e.g. no_session, bad_request, rate_limited, token_expired)." }
        message: { type: string, description: "Localized fallback message." }
    TimeBlock:
      type: object
      required: [id, title, type, time_mode, timezone]
      properties:
        id: { type: string }
        date: { type: string, example: "2026-07-13", description: "YYYY-MM-DD" }
        time: { type: string, nullable: true, example: "14:30", description: "HH:MM or null when unscheduled" }
        title: { type: string }
        type: { type: string, enum: [task, appointment, break, relax, meal] }
        duration_min: { type: integer, nullable: true }
        time_mode: { type: string, enum: [floating, fixed, local], description: "floating=wall clock (no utc_time); fixed=absolute instant; local=circadian, follows current tz. fixed/local carry utc_time." }
        timezone:
          type: string
          example: "Asia/Shanghai"
          description: >
            The EVENT's zone — whose wall clocks this rule's time belongs to.
            A different question from Preferences.timezone, which is where the
            user is now: a lecture imported from a Shanghai timetable stays
            09:00 中国时间 when the student is in London, and the two layers are
            what make that expressible. Empty means floating (whatever the
            reader's own zone says), which is right for "gym at 7" and wrong for
            a class in another country. Set by ICS import from X-WR-TIMEZONE and
            correctable here; a name this build cannot load is rejected.
        utc_time: { type: string, nullable: true, description: "RFC3339 UTC anchor for fixed/local blocks." }
        offset_min: { type: integer, nullable: true }
        offset_ref: { type: string }
        completed: { type: boolean }
        isAchievement: { type: boolean }
        rule_id: { type: string, description: "Set when the block is an occurrence of a ScheduleRule." }
        origin: { type: string, enum: [auto, manual, rule], description: "auto=generated (dashed border, replaced on re-plan); manual=user (survives); rule=materialized occurrence." }
        hidden: { type: boolean, description: "Tombstone — filtered out of reads; never render." }
        note: { type: string, description: "Whatever the user felt like writing when checking the block off — how it went, what was left half-done. Always optional; never prompted for. The agent reads it." }
        lock_level:
          type: string
          enum: ["", none, soft, hard]
          description: >-
            How firmly the time slot is fixed. THREE states, not two: "" means
            never derived yet (the server will fill it in on read), none means
            derived and free to move. hard=set by a timetable, the user cannot
            move it; soft=agreed with someone else, moving needs confirmation.
            Derivation rule and the shared case table live in api/lock-rules.json.
        lock_reason: { type: string, description: "Why it is locked. Derived reasons are looked up per request locale; a user-set reason is stored verbatim." }
        lock_source:
          type: string
          enum: ["", derived, user, agent]
          description: >-
            Who decided the lock. derived=inferred from type+title and safe to
            recompute; user/agent=a deliberate choice, never recomputed. Without
            this a hand-unlocked class would be re-locked on every read.
        rescheduled_from: { type: string, description: "Id of the block this one was re-fished from, chaining each retry back to the original." }
        reschedule_count: { type: integer, description: "How many times this item has been offered a new slot. Past the configured limit the agent stops offering and records the preference instead." }
    DayPlan:
      type: object
      properties:
        id: { type: string, description: "Empty for synthetic rules-only days." }
        sessionId: { type: string }
        date: { type: string }
        blocks: { type: array, items: { $ref: '#/components/schemas/TimeBlock' } }
        sourceType: { type: string, enum: [text, image, auto, rules] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [add, update, remove] }
        match: { type: object, additionalProperties: true, description: "e.g. {id}" }
        changes: { type: object, additionalProperties: true }
        confirm:
          type: boolean
          description: >-
            The way through a soft lock: the user was told this one was agreed
            with someone else and said go ahead. Does nothing for a hard lock or
            a petrified block — those have no way through, and a flag that
            opened them would make the gate advisory. See docs/specs/plan-semantics.md.
    Proposal:
      type: object
      description: >-
        Everything the agent wants to do but has not done — or has done and is
        still offering to undo. Ghosts, cards, decision cards and channel
        approvals are all this, seen from different ends. Semantics in
        docs/specs/plan-semantics.md §three.
      properties:
        id: { type: string }
        state:
          type: string
          enum: [pending, accepted, rejected, expired]
          description: >-
            Four, not three. A silent expiry must stay distinguishable from a
            deliberate no — the ledger keeps everything, and an expired offer
            was never seen.
        level:
          type: string
          enum: [L1, L2, L3]
          description: >-
            The attention ladder — the MEDIUM. L1 an in-view ghost bound to a
            slot, L2 a card in the stack, L3 a push against the ≤3/day budget.
            L0 never becomes a proposal. Independent of whether the proposal may
            ESCALATE, which is decided by what it rests on (see origin/btype):
            a hard-backed one — an appointment, a deadline — may come back louder
            as the moment approaches; a soft one gets one delivery, ever, because
            "ignoring is always safe" is a promise and escalation would break it.
            The distinction is derived server-side from the row, never asserted
            by the agent: "is this important" is exactly the judgement a model
            gets wrong in the direction of interrupting more.
        kind: { type: string, enum: [timed, card, decision] }
        title: { type: string }
        summary: { type: string }
        reason: { type: string }
        evidence: { type: string }
        date: { type: string }
        start: { type: string, description: "HH:MM" }
        dur: { type: integer, nullable: true }
        btype:
          type: string
          description: >-
            The block type this proposal is about. "appointment" is the only
            HARD one today — a slot somebody else is also holding — and future
            hard types (meeting, flight, exam) join that set rather than adding a
            field. task/break/relax/meal are the user's own intentions about
            their own day. Deliberately NOT the same as lockLevel: a lock says
            "this cannot move", hardness says "missing this costs somebody other
            than you".
        lockLevel: { type: string }
        lockReason: { type: string }
        rows:
          type: array
          description: A compound card, each line accepted or rejected on its own.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              state: { type: string, enum: [pending, accepted, rejected, expired] }
        sessionId: { type: string }
        mergeKey: { type: string, description: Same key → only the newest undelivered survives. }
        deliverAfter: { type: string, format: date-time }
        deliveredAt:
          type: string
          format: date-time
          description: >-
            A PERMANENT stamp; nothing clears it. "How many cards are in the
            stack" is a conjunction (pending + delivered + still deliverable),
            not a question about this field.
        pushedAt: { type: string, format: date-time, description: What the ≤3/day push budget counts. }
        ttlPolicy:
          type: string
          enum: [silence_accepts, silence_rejects]
          description: >-
            Acted first → silence confirms; asked first → silence voids.
            Backwards, one of these executes unattended work and the other
            discards an undo window.
        expiresAt: { type: string, format: date-time }
        resolution: { type: string, enum: [user, silence, superseded] }
        origin:
          type: string
          enum: [agent, daemon, upload, protector, user, deadline]
          description: >-
            Which part of the system produced it. "deadline" is the fact track —
            a due date the user or an import put there, the archetypal hard fact,
            and the one origin that licenses escalation. "user" means the user
            asked for this card; it matters for the ledger, since a summoned card
            should not count against rapport the way an unsolicited one does.
        threadId: { type: string }
        rev: { type: integer, description: Optimistic concurrency — row-level accepts race otherwise. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanBlocked:
      type: object
      description: >-
        409 body when the plan gate refuses a write. 409 rather than 403 because
        nothing about the caller is wrong — the request conflicts with the state
        of the block it names, and that state can change.
      required: [error, code, message, blockId, confirmable]
      properties:
        error: { type: string, enum: [blocked] }
        code:
          type: string
          enum: [locked, petrified]
          description: Which rule refused. `petrified` means the day has turned; `locked` means the slot is not the user's to move.
        message: { type: string, description: Localized, ready to show. }
        blockId: { type: string }
        confirmable:
          type: boolean
          description: Re-sending with `action.confirm` would succeed. True only for soft locks.
        lockLevel: { type: string, enum: [hard, soft], description: Absent for a petrify refusal. }
        lockReason: { type: string, description: Absent for a petrify refusal. }
        block: { $ref: '#/components/schemas/TimeBlock' }
    ModelDetail:
      type: object
      properties:
        id: { type: string, description: OUR stable name — what DEFAULT_CHAT_MODEL and the database reference. }
        format: { type: string }
        baseUrl: { type: string, description: Where requests go. "Which gateway is this actually hitting" is the second question after "is the key set". }
        model: { type: string, description: The vendor's name — the perishable half. Shown next to id because that pair is the whole point of having two fields. }
        apiKeyEnv: { type: string, description: The variable NAME. Not a credential. }
        keySet: { type: boolean, description: Whether a key was resolved at all. The value never appears. }
        caps: { type: object, additionalProperties: true }
        roles:
          type: array
          items: { type: string, enum: [chat, vision, planner] }
          description: The default slots this entry currently fills. Derived, so it cannot disagree with what the process is doing — planner reports where it actually lands, including its fallback to the chat model.

    OAuthProviderView:
      type: object
      properties:
        name: { type: string }
        clientId: { type: string, description: Not a secret — it travels in the authorize URL of every login. }
        secretSet: { type: boolean, description: The only thing said about the secret. An id with no secret fails at the token exchange, after the user has already left and come back. }
        redirectUri: { type: string, description: The callback the vendor must have registered. Built by the same function the login flow uses. }
        preset: { type: boolean, description: URLs and field mappings came from a built-in template, which is why a two-line entry works. }

    ProviderView:
      type: object
      properties:
        kind: { type: string, enum: [weather, search, channel] }
        id: { type: string }
        format: { type: string, enum: [builtin, http] }
        impl: { type: string, description: 'For format builtin: the compiled-in implementation.' }
        baseUrl: { type: string, description: For format http. File-only — it is the SSRF entrance. }
        tokenEnv: { type: string, description: The environment variable NAME. Not a credential. }
        tokenSet: { type: boolean, description: Whether that variable currently holds anything. The value never appears. }
        displayName: { type: string }
        logo: { type: string, description: A raster data URI or empty. SVG is refused — it can carry script, and channel logos render in ordinary user clients. }
        enabled: { type: boolean }
        editable: { type: array, items: { type: string }, description: Precomputed so the console does not re-derive a rule that lives on the server. }
        description: { type: object, additionalProperties: { type: string } }
        manifestDescription:
          type: object
          additionalProperties: { type: string }
          description: What the ADAPTER says about itself. Shown as a suggestion; never injected into a prompt and never merged into description.
        approved: { type: boolean }
        health:
          type: object
          properties:
            up: { type: boolean }
            reason: { type: string }
            lastChecked: { type: string, format: date-time }
            failures: { type: integer }
            backoffUntil: { type: string, format: date-time }
        instance: { type: string, description: Which process answered. Health is per process. }
    Session:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        interactionCount: { type: integer }
        signInPrompted: { type: boolean }
        assistantName: { type: string }
        currentTheme: { type: string }
        language: { type: string, enum: [zh-CN, en-US] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Preferences:
      type: object
      properties:
        morningBrief: { type: boolean }
        eveningReview: { type: boolean }
        deadlineAlerts: { type: boolean }
        rollingReplan: { type: boolean }
        gapSuggestions: { type: boolean }
        doNotDisturb: { type: boolean }
        autoPlan: { type: boolean }
        materialCategories:
          type: object
          additionalProperties: { type: boolean }
          description: "Per-category enablement overrides (id → on/off); missing = registry default. Unknown ids and note:false are rejected (400 bad_category)."
        timezone:
          type: string
          description: >
            The IANA zone this user's own day is measured in — it decides when
            the petrify line falls, where their rhythm day boundary sits, and
            what time the morning brief arrives. Empty means "follow the device,
            and until it reports, the deployment default" (WORKER_DEFAULT_TZ).
            Setting it here is the USER choosing, which outranks whatever their
            device reports from then on; send "" to go back to following the
            device. A client also reports its zone implicitly via the timezone
            field on POST /api/ai/companion, which fills in or updates a
            device-detected value but never overwrites this one. 400
            bad_timezone if it is not a zone this build can load.
        timezoneSource:
          type: string
          enum: ["", user, detected]
          readOnly: true
          description: "Who decided the timezone. Read-only — it is set by which door the value came in through."
        location:
          type: string
          maxLength: 128
          description: >
            Where this user is, as free text a weather source can resolve
            ("北京", "Cambridge, MA"). It exists for ONE caller: the morning and
            evening briefs, which look up the weather with no model in the loop
            and therefore cannot ask anybody where to look. The chat tool takes
            a location as an argument, so the model can already ask about
            anywhere — a trip's destination, next week's city — and needs
            nothing stored.

            Same precedence as timezone: setting it here is the USER choosing
            and outranks the client's reports from then on; "" goes back to
            following the client. A client reports its place via the location
            field on POST /api/ai/companion.

            When nothing is known — no setting, and no memory fact stating a
            home — the brief simply has NO weather line. That is deliberate: a
            wrong city is worse than no city, because "17°C and raining" is a
            sentence somebody dresses by.

            Free text rather than coordinates because every weather source here
            resolves a place name itself; geocoding server-side would mean
            owning a geocoder and disagreeing with the source.
        locationSource:
          type: string
          enum: ["", user, detected]
          readOnly: true
          description: "Who decided the location. Read-only, like timezoneSource."
        primaryLocale:
          type: string
          description: >
            This user's main language. Empty means "use the deployment default"
            (GET /api/version locales.defaultPrimary), which is the common case.
            Any locale in locales.available is a legal choice.
        secondaryLocale:
          type: string
          description: >
            The language the home-page switch flips to. Send "" to drop the
            switch entirely. Must differ from primaryLocale — a toggle between a
            language and itself is a control that does nothing (400
            unsupported_locale). The two are validated as a pair, so send both
            when changing both. Changing the pair realigns
            /api/session.language into it when the current value falls outside.
    ScheduleRule:
      type: object
      required: [id, title, type, time_mode, kind, active]
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        type: { type: string, enum: [task, appointment, break, relax, meal] }
        time: { type: string, nullable: true }
        duration_min: { type: integer, nullable: true }
        timezone: { type: string }
        time_mode: { type: string, enum: [floating, fixed, local] }
        kind: { type: string, enum: [once, recurring] }
        date: { type: string, nullable: true }
        freq: { type: string, enum: [daily, weekly, monthly, every_n_days] }
        interval: { type: integer, minimum: 1 }
        by_weekday: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        start_date: { type: string }
        until: { type: string, nullable: true }
        active: { type: boolean }
        source: { type: string, enum: [user, chat, ics, image, canvas] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        type: { type: string, enum: [task, appointment, break, relax, meal], default: task }
        time: { type: string, nullable: true }
        duration_min: { type: integer, nullable: true }
        timezone: { type: string }
        time_mode: { type: string, enum: [floating, fixed, local], default: floating }
        kind: { type: string, enum: [once, recurring], default: recurring }
        date: { type: string, nullable: true }
        freq: { type: string, enum: [daily, weekly, monthly, every_n_days] }
        interval: { type: integer, minimum: 1, default: 1 }
        by_weekday: { type: array, items: { type: integer } }
        start_date: { type: string }
        until: { type: string, nullable: true }
        active: { type: boolean, default: true }
        source: { type: string, enum: [user, chat, ics, image, canvas], default: user }
        note: { type: string, nullable: true }
    Material:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        category: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        source: { type: string }
        mime_type: { type: string }
        storage_ref: { type: string }
        tags: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SearchResult:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        score: { type: number }
    Wish:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        note: { type: string }
        effortMin: { type: integer }
        status: { type: string, enum: [active, done, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatThread:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        summary: { type: string }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        threadId: { type: string }
        sessionId: { type: string }
        role: { type: string, enum: [user, assistant, system, tool] }
        content: { type: string }
        toolEvents: { type: string, description: "JSON array of SSE v2 frames (tool_start/tool_result/decision_card/error) for replay." }
        status: { type: string, enum: ["", pending, done, error], description: "Async turn state. Empty (rows predating the field) reads as done. pending = agent still running (a decision_card may appear in toolEvents while pending — answer via POST /api/decisions/{id}/respond)." }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: "Files sent with this message. Hydrated on read from their own table — not a column." }
        createdAt: { type: string, format: date-time }
    Attachment:
      type: object
      description: >-
        A file on the bus, addressed by id. The storage ref is deliberately
        absent from this schema and from every response: it is a bearer handle
        minted by a store that has no notion of who is asking, so the server
        resolves id → ref itself after checking the session.
      properties:
        id: { type: string }
        sessionId: { type: string }
        threadId: { type: string, description: "Set once bound to a message." }
        messageId: { type: string, description: "Empty while the upload has not been sent." }
        kind: { type: string, enum: [image, audio, video, document, file], description: "What to render. A closed set so a client never has to know that image/avif is an image." }
        mime: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, description: "Of the stored bytes; also the ETag on download." }
        filename: { type: string }
        createdAt: { type: string, format: date-time }
    CustomTheme:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        base: { type: string }
        dark: { type: boolean }
        variables: { type: object, additionalProperties: { type: string }, description: "CSS variable whitelist; color literals only (server-validated)." }
    Course:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        canvasId: { type: string }
        name: { type: string }
        courseCode: { type: string }
        currentScore: { type: number, nullable: true }
        currentGrade: { type: string, nullable: true }
    Assignment:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        courseId: { type: string }
        canvasId: { type: string }
        title: { type: string }
        dueAt: { type: string, format: date-time, nullable: true }
        pointsPossible: { type: number, nullable: true }
        submitted: { type: boolean }
        graded: { type: boolean }
        status:
          type: string
          enum: [pending, planned, done, dismissed]
          description: >
            The planner workflow. "dismissed" means "I am not doing this" — it
            removes the item from counts and plans. To keep the item but stop
            being reminded about it, use remindersOff instead.
        remindersOff:
          type: boolean
          description: >
            Silences the deadline ladder for this one item without changing what
            it is. STRATEGY §1.3: the fact track can only be turned off one item
            at a time; the global deadlineAlerts toggle is deliberately blunt and
            this is what means a user does not have to reach for it.
            The ladder itself is 24h → 12h → 1h → overdue, one message per rung
            per item, ever — which is why the fact track needs no daily budget and
            does not consume the ≤3/day suggestion budget.
    OperationLog:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        actor: { type: string, enum: [user, agent, system] }
        action: { type: string, example: "plan_update" }
        domain:
          type: string
          enum: [schedule, habit, archive, care, system]
          description: >-
            Which part of the user's life the operation touched. Two consumers:
            the river colours its bands by domain, and rapport (how much latitude
            the user has given the agent) is scored per domain — being trusted
            with the schedule says nothing about being trusted to archive things.
            Only the first four are scored; system is plumbing. Derived from the
            action prefix when a row does not carry one.
        targetId: { type: string }
        date: { type: string }
        summary: { type: string, description: "Short list-view line, clamped to 512 runes." }
        detail: { type: string, description: "Full JSON payload including before/after snapshots — this is what revert replays. Unbounded." }
        status: { type: string, enum: [ok, failed] }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    AdminPrincipal:
      type: object
      description: >-
        Who is holding a console session, and what they may do. `root` is the
        ADMIN_TOKEN (or a cookie minted from it) and passes everything; `owner`
        is a person marked as super-administrator, which is a MARK rather than a
        role holding every permission — so a permission added in a later release
        is held by every owner with no data change. Otherwise `permissions` is
        the union of the caller's groups.
      properties:
        root: { type: boolean }
        owner: { type: boolean }
        userId: { type: string, description: Absent for the root credential. }
        permissions: { type: array, items: { type: string } }
        ok: { type: boolean, description: Present on login only. }
        expiresIn: { type: integer, description: 'Seconds; present on login only.' }
    AdminRole:
      type: object
      description: >-
        A named permission set, and also a user group — one shape for both,
        because the only difference is whether `permissions` is empty. An empty
        set is a plain group, which is what a commercial tier is; `admin` is
        derived from that rather than stored, so it can never go stale in the
        dangerous direction.
      properties:
        name: { type: string, maxLength: 64 }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
        members: { type: array, items: { type: string }, description: User ids. }
        admin: { type: boolean, description: Derived; true when permissions is non-empty. }
    AICallLog:
      type: object
      description: One model call. Metadata only — see the ailogs endpoint for why there is no body here.
      properties:
        id: { type: string }
        sessionId: { type: string }
        endpoint: { type: string }
        model: { type: string }
        promptTokens: { type: integer }
        compTokens: { type: integer }
        durationMs: { type: integer }
        status: { type: string, enum: [ok, error] }
        error: { type: string, description: Truncated to 300 characters. }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    AdminDBTable:
      type: object
      description: >-
        One catalogued table. `class` is what decides who may read it — the
        author's decision that user content is *assignable* only means something
        if it can be assigned separately from the operational tables.
      properties:
        name: { type: string }
        class: { type: string, enum: [operational, user_content] }
        rows: { type: integer, description: '-1 when the count itself failed.' }
        readable: { type: boolean, description: Whether THIS caller may open it. Listed either way. }
        deletable: { type: boolean }
        whyNot: { type: string, description: Why single-row delete has no meaning here. }
    AdminStats:
      type: object
      properties:
        users: { type: integer }
        sessions: { type: integer }
        aiCalls: { type: integer }
        tokenUsed: { type: integer }
        feedbackUseful: { type: integer }
        feedbackTotal: { type: integer }
